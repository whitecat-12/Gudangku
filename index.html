<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Bifetindo WMS — Pasar B2B Industri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#0b1b33;
  --ink2:#14294a;
  --mut:#5b7295;
  --mut2:#8ba0bf;
  --line:#dbe7f5;
  --line2:#c5d8ee;
  --paper:#ffffff;
  --paper2:#f6faff;
  --field:#f1f7fe;
  --brand:#2563eb;
  --brand2:#0ea5e9;
  --brand3:#6366f1;
  --mint:#10b981;
  --sun:#f59e0b;
  --rose:#ef4444;
  --sh:0 1px 2px rgba(11,27,51,.05),0 10px 30px -14px rgba(11,27,51,.18);
  --sh2:0 2px 4px rgba(11,27,51,.06),0 24px 48px -22px rgba(11,27,51,.30);
  --sh3:0 2px 4px rgba(11,27,51,.06),0 40px 80px -32px rgba(11,27,51,.40);
  --r:20px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:#eaf2fc;
  background-image:
    radial-gradient(1200px 700px at 100% -10%, #cfe6ff 0%, transparent 60%),
    radial-gradient(1000px 600px at -10% 0%, #d8f3ff 0%, transparent 55%),
    radial-gradient(900px 600px at 50% 110%, #e8e0ff 0%, transparent 55%),
    linear-gradient(180deg,#eaf2fc 0%,#e2edfa 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
::selection{background:#bfdbfe;color:#0b1b33}
h1,h2,h3{font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;letter-spacing:-.03em}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* buttons */
.btn{
  border:0;border-radius:15px;padding:14px 18px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#0ea5e9 100%);
  color:#fff;width:100%;cursor:pointer;display:inline-flex;gap:9px;align-items:center;justify-content:center;
  box-shadow:0 8px 22px -12px rgba(37,99,235,.9),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .18s cubic-bezier(.2,.8,.25,1), box-shadow .18s ease, filter .18s ease;
  position:relative;overflow:hidden;
}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s ease}
.btn:hover{filter:brightness(1.05)}
.btn:hover:after{transform:translateX(120%)}
.btn:active{transform:translateY(1px) scale(.994)}
.btn.g{background:var(--paper);color:var(--ink);border:1px solid var(--line2);box-shadow:0 1px 2px rgba(11,27,51,.05)}
.btn.g:hover{background:#f8fbff;border-color:#a9c6e6}
.btn.s{width:auto;padding:10px 15px;font-size:13px;border-radius:12px;gap:8px}
.btn.ok{background:linear-gradient(135deg,#047857,#10b981);box-shadow:0 8px 22px -12px rgba(16,185,129,.9)}
.btn.danger{background:linear-gradient(135deg,#b91c1c,#ef4444);box-shadow:0 8px 22px -12px rgba(239,68,68,.9)}

/* brand */
.brandmark{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brandmark>span{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
  background:linear-gradient(135deg,#1e40af 0%,#2563eb 50%,#22d3ee 100%);
  box-shadow:0 10px 24px -12px rgba(37,99,235,1),inset 0 1px 0 rgba(255,255,255,.3);
  position:relative;
}
.brandmark>span:after{content:"";position:absolute;inset:1px;border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.brandmark small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* inputs */
label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.005em}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{
  width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;outline:0;
  transition:border-color .16s,box-shadow .16s,background .16s;color:var(--ink);font-size:14.5px;
}
input::placeholder,textarea::placeholder{color:#9db0c8}
input:focus,select:focus,textarea:focus{border-color:#7fb0f0;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
select option{color:var(--ink);background:#fff}
.err{color:var(--rose);font-size:12.5px;min-height:18px;font-weight:600}

/* ============ LOGIN / DAFTAR — compact fit ============ */
#login{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  max-width:430px;margin:auto;gap:10px;
  position:relative;
}
#login:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(500px 340px at 110% 0%, rgba(14,165,233,.22), transparent 60%),
    radial-gradient(440px 300px at -10% 100%, rgba(99,102,241,.18), transparent 60%);
  filter:blur(6px);
}
#login>*{position:relative;z-index:1}
.brand-top{
  display:flex;align-items:center;gap:10px;font-weight:800;font-size:17.5px;letter-spacing:-.03em;
  align-self:stretch;padding:0 2px;margin-bottom:2px;
}
.brand-top>span{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,#1e40af 0%,#2563eb 50%,#22d3ee 100%);
  box-shadow:0 10px 22px -12px rgba(37,99,235,1),inset 0 1px 0 rgba(255,255,255,.3);
}
.brand-top small{display:block;font-size:9.5px;color:var(--mut);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.auth-card{
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.95);border-radius:24px;
  padding:18px 16px 16px;box-shadow:var(--sh3);
  display:grid;gap:10px;width:100%;
  animation:pop .45s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.auth-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.auth-head h1{font-size:21px;margin:0;font-weight:800;line-height:1.1;letter-spacing:-.035em}
.auth-head p{color:var(--mut);margin:4px 0 0;font-size:12px;line-height:1.45}
.auth-pill{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  background:linear-gradient(135deg,#e0ecff,#e6f7ff);color:#1d4ed8;
  font-size:10px;font-weight:800;letter-spacing:.03em;
  padding:5px 9px;border-radius:99px;border:1px solid #cfe0fb;white-space:nowrap;
}
.auth-field label{margin-bottom:4px;font-size:11px;letter-spacing:.01em}
.auth-field input{padding:11px 13px;font-size:14px;border-radius:12px}
.auth-actions{display:grid;gap:8px;margin-top:2px}
.auth-actions .btn{padding:12px 14px;font-size:14px;border-radius:13px}
.auth-actions .btn.g{padding:11px 14px}
.auth-divider{
  display:flex;align-items:center;gap:10px;color:#a3b6ce;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;margin:1px 0;
}
.auth-divider:before,.auth-divider:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#d3e2f3,transparent)}
.auth-foot{text-align:center;font-size:10.5px;color:var(--mut);line-height:1.6;max-width:400px}
.auth-foot a{color:var(--brand);font-weight:700;text-decoration:none}
.auth-foot a:hover{text-decoration:underline}

/* ============ APP ============ */
#app{min-height:100dvh;max-width:760px;margin:auto;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
header{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 18px;
  background:rgba(234,242,252,.72);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid rgba(197,216,238,.6);
}
header .brandmark{font-size:16px}
header .brandmark>span{width:34px;height:34px;border-radius:11px;font-size:13px}
header #ttl{font-weight:800;letter-spacing:-.03em;font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif}
main{padding:18px 16px;display:grid;gap:14px;align-content:start}

.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  box-shadow:var(--sh);
}
h2{font-size:19px;margin:0;font-weight:800}
h3{font-size:14.5px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h3 i{color:var(--brand);font-size:13px}
.mut{color:var(--mut);font-size:12.5px;line-height:1.5}
.mut i{color:var(--mut2);margin-right:4px}

/* HERO */
.hero{
  background:
    radial-gradient(700px 380px at 100% 0%, rgba(34,211,238,.35), transparent 60%),
    radial-gradient(600px 340px at 0% 100%, rgba(99,102,241,.30), transparent 60%),
    linear-gradient(135deg,#0b2545 0%,#1d4ed8 55%,#0891b2 100%);
  color:#fff;border:0;border-radius:24px;padding:22px;
  box-shadow:0 24px 48px -24px rgba(11,37,69,.75),inset 0 1px 0 rgba(255,255,255,.15);
  position:relative;overflow:hidden;
}
.hero:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:32px 32px;
  mask-image:radial-gradient(ellipse at 100% 0%,#000 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 100% 0%,#000 0%,transparent 70%);
}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:22px;letter-spacing:-.04em;margin-bottom:6px}
.hero .mut{color:#bfdbfe;font-size:13px}
.hero .mut b{color:#fff}
.hero-tag{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  padding:5px 11px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:10px;color:#fff;
  backdrop-filter:blur(8px);
}

/* STATS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{
  display:grid;gap:4px;padding:16px;border-radius:18px;
  background:linear-gradient(180deg,#ffffff,#f8fbff);
  border:1px solid var(--line);
  box-shadow:var(--sh);
  position:relative;overflow:hidden;
}
.stat:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#2563eb,#0ea5e9,#22d3ee);opacity:.85}
.stat .mut{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.stat b{display:block;font-size:26px;letter-spacing:-.04em;line-height:1.1;font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif}

/* MENU */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.menu button{
  background:linear-gradient(180deg,#ffffff,#f8fbff);
  border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;cursor:pointer;
  min-height:116px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh);
  transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .18s ease,border-color .18s ease;
  position:relative;overflow:hidden;color:var(--ink);
}
.menu button:before{content:"";position:absolute;inset:0;background:radial-gradient(400px 200px at 100% 0%, rgba(37,99,235,.06), transparent 60%);opacity:0;transition:opacity .2s}
.menu button:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:#b9d3f2}
.menu button:hover:before{opacity:1}
.menu button:active{transform:translateY(0) scale(.99)}
.menu .ic{
  font-size:16px;color:var(--brand);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#e0ecff,#eff6ff);margin-bottom:2px;
  position:relative;z-index:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
.menu b{font-size:14px;letter-spacing:-.02em;font-weight:800;position:relative;z-index:1}
.menu .mut{font-size:11.5px;line-height:1.35;position:relative;z-index:1}
.menu .wms{
  grid-column:1/-1;min-height:108px;
  background:
    radial-gradient(500px 240px at 100% 0%, rgba(34,211,238,.35), transparent 60%),
    linear-gradient(135deg,#1e40af 0%,#2563eb 50%,#06b6d4 100%);
  border:0;color:#fff;
  box-shadow:0 20px 40px -20px rgba(37,99,235,.95);
}
.menu .wms:before{background:radial-gradient(400px 200px at 100% 0%, rgba(255,255,255,.18), transparent 60%);opacity:1}
.menu .wms .ic{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.menu .wms .mut{color:#cfe6ff}
.menu .wms b{font-size:17px}

/* SEGMENT */
.seg{display:flex;background:#e4edf9;border:1px solid var(--line);border-radius:14px;padding:4px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:11px 8px;border-radius:11px;font-weight:700;font-size:12.5px;
  color:var(--mut);cursor:pointer;transition:background .16s,color .16s,box-shadow .16s}
.seg button.on{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px -2px rgba(11,27,51,.18)}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:10.5px;padding:4px 9px;border-radius:99px;background:#d1fae5;color:#047857;
  font-weight:800;white-space:nowrap;letter-spacing:.02em}
.tag.w{background:#fef3c7;color:#a16207}
.tag.i{background:#dbeafe;color:#1d4ed8}

.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty i{font-size:36px;opacity:.4;margin-bottom:14px;display:block;color:var(--brand)}
.empty div{margin-bottom:14px;font-size:13.5px;font-weight:600}
.empty .btn{width:auto;margin:auto}

/* TOGGLE */
.tg{position:relative;width:48px;height:28px;flex:none}
.tg input{opacity:0;position:absolute;inset:0;z-index:2;margin:0;cursor:pointer;width:100%;height:100%}
.tg b{position:absolute;inset:0;background:#dbe6f3;border:1px solid var(--line2);border-radius:99px;transition:.22s}
.tg b::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.22s}
.tg input:checked+b{background:linear-gradient(135deg,#2563eb,#0891b2);border-color:#2563eb}
.tg input:checked+b::after{left:23px}

.fld{margin-bottom:11px}

/* PLANS */
.plan{position:relative;transition:border-color .18s,box-shadow .18s,transform .18s}
.plan.cur{border-color:#7fb0f0;box-shadow:0 0 0 4px rgba(37,99,235,.10),var(--sh)}
.plan .price{font-size:28px;font-weight:800;letter-spacing:-.04em;margin:8px 0 2px;font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif}
.plan .price small{font-size:12px;font-weight:600;color:var(--mut)}
.plan ul{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px;font-size:13px;color:#27405f}
.plan li{display:flex;align-items:flex-start;gap:9px;line-height:1.4}
.plan li i{color:var(--mint);margin-top:3px;font-size:11px}
.pop{position:absolute;top:-11px;right:16px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;
  font-size:10.5px;font-weight:800;padding:4px 11px;border-radius:99px;
  box-shadow:0 8px 16px -6px rgba(245,158,11,.95);letter-spacing:.03em;text-transform:uppercase}

/* NAV */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid rgba(197,216,238,.6);
  display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));
  max-width:760px;margin:auto;
  box-shadow:0 -8px 30px -20px rgba(11,27,51,.4);
}
nav button{
  flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;color:var(--mut);padding:8px 0 5px;cursor:pointer;border-radius:14px;
  transition:color .16s,background .16s,transform .16s;position:relative;
}
nav button i{font-size:18px;transition:transform .18s cubic-bezier(.2,.8,.25,1)}
nav button.on{color:#1d4ed8}
nav button.on i{transform:translateY(-2px) scale(1.08)}
nav button.on::after{
  content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:99px;
  background:linear-gradient(90deg,#2563eb,#0ea5e9);
}

/* WMS overlay */
#wms{position:fixed;inset:0;z-index:60;background:#000}
#wms iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#back{position:absolute;z-index:2;left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:auto;padding:12px 18px;font-size:13px;box-shadow:0 16px 32px rgba(0,0,0,.45)}

/* SHEET */
#sheet{position:fixed;inset:0;z-index:80;background:rgba(11,27,51,.48);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet>div{
  background:var(--paper);width:100%;max-width:760px;border-radius:28px 28px 0 0;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:92dvh;overflow:auto;
  display:grid;gap:13px;box-shadow:0 -16px 48px rgba(11,27,51,.28);
  animation:up .32s cubic-bezier(.2,.8,.25,1) both;
}
#sheet>div:before{
  content:"";display:block;width:44px;height:4px;border-radius:99px;background:#d5e2f1;margin:-8px auto 4px;
}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}

.opt{
  display:flex;gap:11px;align-items:center;padding:14px 13px;border:1.5px solid var(--line);
  border-radius:15px;cursor:pointer;font-weight:700;font-size:13px;background:var(--field);
  transition:border-color .16s,background .16s,transform .16s;
}
.opt:hover{transform:translateY(-1px)}
.opt.on{border-color:#2563eb;background:#eaf2ff;color:#1d4ed8;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.opt i{font-size:16px}

/* TOAST */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:110px;
  background:#0b2545;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:13px;
  z-index:90;white-space:nowrap;box-shadow:0 16px 32px -10px rgba(11,27,51,.6);
  animation:toastIn .3s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--field);
  padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--ink2)}
.card .row + .card{margin-top:10px}
#view .card{animation:rise .4s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view .card:nth-child(2){animation-delay:.04s}
#view .card:nth-child(3){animation-delay:.08s}
#view .card:nth-child(4){animation-delay:.12s}

@media(max-width:400px){
  .menu{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr 1fr}
  header .brandmark small{display:none}
  .auth-head{flex-direction:column;gap:6px}
  .auth-pill{align-self:flex-start}
}
</style>
</head>
<body>

<section id="login">

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const ic=n=>'<i class="fa-solid fa-'+n+'"></i>';
const PLANS={
 free:{n:'Gratis',m:0,list:0,ads:0,auc:0,f:['Akses 3D WMS','Lihat pasar B2B','Beli dari mitra']},
 pro:{n:'Pro',m:99000,list:20,ads:1,auc:2,f:['Semua fitur Gratis','Jual hingga 20 produk','1 iklan aktif di Pasar B2B','Buka hingga 2 lelang aktif','Hubungi Sales via WhatsApp']},
 bisnis:{n:'Bisnis',m:299000,list:999,ads:5,auc:10,f:['Semua fitur Pro','Produk jual tanpa batas','5 iklan aktif','Buka hingga 10 lelang aktif','Billboard iklan di gudang 3D','Badge mitra terverifikasi']}};
/* Konfigurasi Firebase SAMA dengan Sistem Gudang 3D */
const CFG={apiKey:'AIzaSyBQtmIXHNwkcOXw5C9xlCEz3GoU5ajRu2Q',authDomain:'gudangku-34279.firebaseapp.com',projectId:'gudangku-34279',storageBucket:'gudangku-34279.firebasestorage.app',messagingSenderId:'292899782383',appId:'1:292899782383:web:5117db5a1376262de5251a',measurementId:'G-6017600DDT'};
const READY=!CFG.apiKey.startsWith('ISI');if(READY)firebase.initializeApp(CFG);
const auth=READY?firebase.auth():null,db=READY?firebase.firestore():null;
const EMPTY=()=>({plan:'free',exp:0,items:[],market:[],ads:[],sponsor:[],auc:[],tx:[],pend:[],prof:{}});
let S=EMPTY(),uid='',unsub=[],user='',tab='home',pasarTab='jelajah',cycle='m',pick='QRIS';
const save=()=>{};
const fe=e=>toast(e.code=='permission-denied'?'Ditolak oleh aturan Firestore':(e.message||'Terjadi kesalahan'));
const plan=()=>(S.plan!=='free'&&S.exp>Date.now())?S.plan:'free';
const P=()=>PLANS[plan()];
const sponsorCard=a=>`<div class="card" style="border-color:#fcd34d;background:linear-gradient(180deg,#fffbeb,#fffdf7)"><div class="row"><b>${esc(a.t)}</b><span class="tag w">Sponsor</span></div><div class="mut" style="margin-top:4px">${esc(a.d||'')}</div><div class="mut">${ic('store')} ${esc(a.ownerName||'')}</div></div>`;
const adsOn=()=>S.ads.filter(a=>a.end>Date.now()).length;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const empty=(i,t,b)=>'<div class="empty">'+ic(i)+'<div>'+t+'</div>'+(b||'')+'</div>';
const lock=(t)=>'<div class="card">'+empty('lock',t,'<button class="btn" data-go="langganan">'+ic('crown')+'Lihat Paket Langganan</button>')+'</div>';
const T={admin:'Verifikasi Pembayaran',lelang:'Lelang',home:'Beranda',pasar:'Pasar B2B',iklan:'Iklan Saya',langganan:'Langganan',set:'Pengaturan'};
const NAV=[['home','house','Beranda'],['wms','warehouse','3D WMS'],['pasar','store','Pasar'],['langganan','crown','Paket'],['set','gear','Setelan']];

const V={
home(){const p=P();return `
 <div class="card hero">
   <span class="hero-tag"><i class="fa-solid fa-bolt"></i> Paket ${p.n}</span>
   <h2>Halo, ${esc(user)}</h2>
   <div class="mut">${plan()!=='free'?'Langganan aktif s.d. <b>'+new Date(S.exp).toLocaleDateString('id-ID')+'</b>':'Upgrade paket untuk membuka fitur lengkap'}</div>
 </div>
 <div class="g2">
  <div class="card stat"><span class="mut">Rak terpakai</span><b>0</b></div>
  <div class="card stat"><span class="mut">Produk dijual</span><b>${S.items.length}</b></div>
  <div class="card stat"><span class="mut">Iklan aktif</span><b>${adsOn()}</b></div>
  <div class="card stat"><span class="mut">Transaksi</span><b>${S.tx.length}</b></div></div>
 <h3>Menu utama</h3>
 <div class="menu">
  <button class="wms" data-open="1"><span class="ic">${ic('warehouse')}</span><b>3D WMS</b><span class="mut">Buka Sistem Gudang 3D</span></button>
  <button data-go="pasar"><span class="ic">${ic('cart-shopping')}</span><b>Jual Beli</b><span class="mut">Pasar B2B</span></button>
  <button data-go="iklan"><span class="ic">${ic('bullhorn')}</span><b>Iklan Berbayar</b><span class="mut">Promosikan bisnis</span></button>
  <button data-go="lelang"><span class="ic">${ic('gavel')}</span><b>Lelang</b><span class="mut">Buka &amp; ikut lelang</span></button>
  ${isAdmin()?`<button data-go="admin"><span class="ic">${ic('user-shield')}</span><b>Verifikasi</b><span class="mut">${S.pend.length} menunggu</span></button>`:''}
  <button data-go="langganan"><span class="ic">${ic('crown')}</span><b>Langganan</b><span class="mut">Paket ${p.n}</span></button>
  <button data-go="set"><span class="ic">${ic('building')}</span><b>Profil &amp; Akun</b><span class="mut">Legalitas perusahaan</span></button></div>`},
pasar(){const seg=`<div class="seg"><button data-pt="jelajah" class="${pasarTab=='jelajah'?'on':''}">${ic('magnifying-glass')} Jelajah</button><button data-pt="jual" class="${pasarTab=='jual'?'on':''}">${ic('tags')} Jualan Saya</button></div>`;
 if(pasarTab=='jelajah')return seg+S.sponsor.filter(a=>a.end>Date.now()&&a.k=='feed').map(sponsorCard).join('')+(S.market.length?S.market.map(i=>itemCard(i,false)).join(''):'<div class="card">'+empty('box-open','Belum ada produk di pasar.')+'</div>');
 const p=P();
 if(!p.list)return seg+lock('Fitur jual beli tersedia untuk paket Pro dan Bisnis.');
 return seg+`<div class="row"><span class="mut">${S.items.length} / ${p.list>900?'∞':p.list} produk</span><button class="btn s" data-act="newitem">${ic('plus')}Tambah Produk</button></div>`+
  (S.items.length?S.items.map(i=>itemCard(i,true)).join(''):'<div class="card">'+empty('box-open','Belum ada produk yang kamu jual.')+'</div>')},
iklan(){const p=P();if(!p.ads)return lock('Iklan berbayar tersedia untuk paket Pro dan Bisnis.');
 return `<div class="row"><span class="mut">${adsOn()} / ${p.ads} iklan aktif</span><button class="btn s" data-act="newad">${ic('plus')}Buat Iklan</button></div>`+
  (S.ads.length?S.ads.map(a=>`<div class="card"><div class="row"><b>${esc(a.t)}</b><span class="tag ${a.end>Date.now()?'':'w'}">${a.end>Date.now()?'Aktif':'Berakhir'}</span></div><div class="mut">${ic(a.k=='3d'?'cube':'rectangle-ad')} ${a.k=='3d'?'Billboard 3D':'Feed Pasar'} · s.d. ${new Date(a.end).toLocaleDateString('id-ID')}</div><div style="margin-top:6px">${esc(a.d)}</div><button class="btn g s" style="margin-top:10px" data-del="ad" data-id="${a.id}">${ic('trash')}Hapus</button></div>`).join(''):'<div class="card">'+empty('bullhorn','Belum ada iklan.')+'</div>')},
langganan(){const cur=plan();
 return `<div class="seg"><button data-cy="m" class="${cycle=='m'?'on':''}">Bulanan</button><button data-cy="y" class="${cycle=='y'?'on':''}">Tahunan (hemat 2 bln)</button></div>`+
 Object.entries(PLANS).map(([k,v])=>{const pr=cycle=='m'?v.m:v.m*10;
  return `<div class="card plan ${cur==k?'cur':''}">${k=='pro'?'<span class="pop">Populer</span>':''}<div class="row"><h2>${v.n}</h2>${cur==k?'<span class="tag">Aktif</span>':''}</div>
  <div class="price">${pr?rp(pr):'Gratis'}<small class="mut">${pr?(cycle=='m'?' /bulan':' /tahun'):''}</small></div>
  <ul>${v.f.map(f=>'<li>'+ic('check')+f+'</li>').join('')}</ul>
  ${k=='free'?'':`<button class="btn ${cur==k?'g':''}" data-buy="${k}">${ic('credit-card')}${cur==k?'Perpanjang':'Pilih '+v.n}</button>`}</div>`}).join('')+
 `<div class="card"><h3>${ic('receipt')} Riwayat pembayaran</h3>`+(S.tx.length?S.tx.slice().reverse().map(t=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--line)"><div><b>${t.pn}</b><div class="mut">${new Date(t.at).toLocaleDateString('id-ID')} · ${t.method}</div></div><div style="text-align:right"><b>${rp(t.amount)}</b><div><span class="tag ${t.status=='lunas'?'':'w'}">${t.status}</span></div></div></div>`).join(''):empty('file-invoice','Belum ada transaksi.'))+'</div>'},
lelang(){const p=P();if(!p.auc)return lock('Fitur lelang tersedia untuk paket Pro dan Bisnis.');
 const seg=`<div class="seg"><button data-lt="aktif" class="${lelTab=='aktif'?'on':''}">${ic('gavel')} Lelang Aktif</button><button data-lt="riwayat" class="${lelTab=='riwayat'?'on':''}">${ic('clock-rotate-left')} Riwayat</button></div>`;
 const L=AU().filter(a=>lelTab=='aktif'?aucLive(a):!aucLive(a)).sort((a,b)=>b.id-a.id);
 const top=`<div class="row"><span class="mut">${aucAct()} / ${p.auc} lelang aktif</span><button class="btn s" data-act="newauc">${ic('plus')}Buka Lelang</button></div>`;
 const cards=L.length?L.map(a=>{const own=a.owner===uid,live=aucLive(a),nx=a.bids.length?a.cur+a.step:a.start,lb=a.bids[a.bids.length-1];
 return `<div class="card"><div class="row"><b>${esc(a.t)}</b>${own?'<span class="tag">Milikmu</span>':''}</div>${a.d?`<div class="mut" style="margin:4px 0">${esc(a.d)}</div>`:''}
 <div class="g2" style="margin:8px 0"><div><div class="mut">${a.bids.length?'Tawaran tertinggi':'Harga awal'}</div><b style="color:var(--brand);font-size:17px">${rp(a.cur)}</b></div><div><div class="mut">${live?'Sisa waktu':'Status'}</div><b class="${live?'':'mut'}" ${live?`data-end="${a.end}"`:''}>${live?left(a.end-Date.now()):'Selesai'}</b></div></div>
 <div class="mut">${ic('users')} ${a.bids.length} tawaran · kelipatan ${rp(a.step)}${lb?' · oleh '+esc(lb.by):''}</div>
 ${live?(own?`<div class="g2" style="margin-top:10px"><button class="btn g s" data-act="endauc" data-id="${a.id}">${ic('flag-checkered')}Akhiri</button></div>`:`<button class="btn" style="margin-top:10px" data-act="bid" data-id="${a.id}">${ic('hand-holding-dollar')}Bid ${rp(nx)}</button>`):`<div style="margin-top:10px">${lb?ic('trophy')+' Pemenang: <b>'+esc(lb.by)+'</b> · '+rp(a.cur):ic('circle-xmark')+' Tidak ada penawar'}</div>`}</div>`}).join(''):'<div class="card">'+empty('gavel',lelTab=='aktif'?'Belum ada lelang aktif.':'Belum ada riwayat lelang.')+'</div>';
 return seg+top+cards},
admin(){if(!isAdmin())return lock('Khusus admin.');
 return S.pend.length?S.pend.slice().sort((a,b)=>a.at-b.at).map(p=>`<div class="card"><div class="row"><b>${esc(p.name||p.email)}</b><span class="tag w">Menunggu</span></div><div class="mut">${esc(p.email||'')}</div><div style="margin:6px 0">Paket <b>${esc(p.pn)}</b> (${p.cycle=='m'?'1 bulan':'1 tahun'}) · <b>${rp(p.amount)}</b></div><div class="mut">${ic('wallet')} ${esc(p.method)}${p.note?' · '+esc(p.note):''}</div><div class="g2" style="margin-top:10px"><button class="btn s" data-act="approve" data-id="${p.id}">${ic('check')}Setujui</button><button class="btn g s" data-act="reject" data-id="${p.id}">${ic('xmark')}Tolak</button></div></div>`).join(''):'<div class="card">'+empty('circle-check','Tidak ada pembayaran yang menunggu.')+'</div>'},
set(){const f=S.prof;const I=(id,l,t)=>`<div class="fld"><label>${l}</label><input type="${t||'text'}" data-pf="${id}" value="${esc(f[id]||'')}"></div>`;
 return `<div class="card"><h3>${ic('fingerprint')} UID akun</h3><div class="row"><code style="word-break:break-all">${uid}</code><button class="btn g s" data-copy="${uid}">${ic('copy')}</button></div></div>
 <div class="card"><h3>${ic('building')} Profil perusahaan</h3>${I('nama','Nama PT')}${I('bidang','Bidang usaha')}${I('alamat','Alamat kantor')}${I('kontak','Nomor kontak','tel')}</div>
 <div class="card"><h3>${ic('shield-halved')} Dokumen legalitas</h3>${['NIB','NPWP','SIUP'].map(d=>`<div class="row fld"><span>${d}</span><span class="tag w">Belum diunggah</span></div>`).join('')}</div>
 <div class="card"><h3>${ic('rectangle-ad')} Tampilan iklan &amp; mitra</h3>${[['pasar','Tampilkan profil di Pasar B2B'],['wa','Hubungi Sales via WhatsApp'],['hub','Tampilkan produk utama di Hub']].map(([k,l])=>`<div class="row fld"><span>${l}</span><label class="tg"><input type="checkbox" data-tg="${k}" ${f['t_'+k]?'checked':''}><b></b></label></div>`).join('')}</div>
 <button class="btn" data-act="saveprof">${ic('floppy-disk')}Simpan Perubahan</button>`}
};
function itemCard(i,own){return `<div class="card"><div class="row"><b>${esc(i.n)}</b><span class="tag">${esc(i.c)}</span></div><div class="mut">${ic('store')} ${esc(i.ownerName||'')}</div><div class="row" style="margin-top:6px"><b style="color:var(--brand);font-size:16px">${rp(i.p)}</b><span class="mut">Stok ${i.s}</span></div>${own?`<button class="btn g s" style="margin-top:10px" data-del="item" data-id="${i.id}">${ic('trash')}Hapus</button>`:''}</div>`}
function render(){$('#ttl').textContent=T[tab];$('#view').innerHTML=V[tab]();
 $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button class="${k==tab?'on':''}" ${k=='wms'?'data-open="1"':'data-go="'+k+'"'}>${ic(i)}${l}</button>`).join('');scrollTo(0,0)}
function go(k){tab=k;render()}
function sheet(h){$('#sheetc').innerHTML=h;$('#sheet').classList.remove('hide')}
function closeSheet(){$('#sheet').classList.add('hide')}
function itemForm(){sheet(`<h2>Tambah produk</h2><div><label>Nama produk</label><input type="text" id="f1"></div><div class="g2"><div><label>Harga (Rp)</label><input type="number" id="f2" inputmode="numeric"></div><div><label>Stok</label><input type="number" id="f3" inputmode="numeric"></div></div><div><label>Kategori</label><select id="f4"><option>Ready Stock</option><option>Pre-Order</option><option>Jasa</option></select></div><button class="btn" data-act="saveitem">${ic('check')}Simpan</button><button class="btn g" data-act="close">Batal</button>`)}
function adForm(){sheet(`<h2>Buat iklan</h2><div><label>Judul iklan</label><input type="text" id="f1"></div><div><label>Deskripsi</label><textarea id="f2" rows="3"></textarea></div><div class="g2"><div><label>Jenis</label><select id="f3"><option value="feed">Feed Pasar</option>${plan()=='bisnis'?'<option value="3d">Billboard 3D</option>':''}</select></div><div><label>Durasi (hari)</label><input type="number" id="f4" value="7" inputmode="numeric"></div></div><button class="btn" data-act="savead">${ic('check')}Tayangkan</button><button class="btn g" data-act="close">Batal</button>`)}
let lelTab='aktif';
const AU=()=>S.auc||(S.auc=[]);
const aucLive=a=>!a.done&&a.end>Date.now();
const aucAct=()=>AU().filter(a=>a.owner===uid&&aucLive(a)).length;
const left=ms=>{ms=Math.max(0,ms/1000|0);return [ms/3600|0,(ms%3600)/60|0,ms%60].map(n=>String(n).padStart(2,'0')).join(':')};
function aucForm(){sheet(`<h2>Buka lelang</h2><div><label>Nama barang</label><input type="text" id="f1"></div><div><label>Deskripsi</label><textarea id="f2" rows="2"></textarea></div><div class="g2"><div><label>Harga awal (Rp)</label><input type="number" id="f3" inputmode="numeric"></div><div><label>Kelipatan bid (Rp)</label><input type="number" id="f4" inputmode="numeric"></div></div><div><label>Durasi (jam)</label><input type="number" id="f5" value="24" inputmode="numeric"></div><button class="btn" data-act="saveauc">${ic('gavel')}Mulai Lelang</button><button class="btn g" data-act="close">Batal</button>`)}
let uc=0;
const PAY=[{k:'BCA',i:'building-columns',n:'0092611297',a:'a.n. Fajar Abdulloh'},{k:'DANA',i:'wallet',n:'083165548613',a:'Kirim ke nomor DANA'},{k:'OVO',i:'mobile-screen',n:'083165548613',a:'Kirim ke nomor OVO'},{k:'PayPal',i:'globe',n:'abdullohfajar110@gmail.com',a:'Akun PayPal (@FAJARABDULLOH282)'}];
function checkout(k){const v=PLANS[k],a=cycle=='m'?v.m:v.m*10;uc=uc||(100+Math.random()*899|0);const tot=a+uc,m=PAY.find(x=>x.k==pick)||PAY[0];pick=m.k;
 sheet(`<h2>Pembayaran</h2><div class="card"><div class="row"><span>Paket ${v.n} (${cycle=='m'?'1 bulan':'1 tahun'})</span><b>${rp(a)}</b></div><div class="row mut"><span>Kode unik</span><span>${rp(uc)}</span></div><div class="row" style="margin-top:6px"><b>Total transfer</b><b style="color:var(--brand);font-size:17px">${rp(tot)}</b></div></div>
 <div class="g2">${PAY.map(p=>`<div class="opt ${pick==p.k?'on':''}" data-m="${p.k}" data-k="${k}">${ic(p.i)}<b>${p.k}</b></div>`).join('')}</div>
 <div class="card"><div class="mut">${ic(m.i)} ${m.k} · ${m.a}</div><div class="row" style="margin-top:6px"><b style="font-size:17px;word-break:break-all">${m.n}</b><button class="btn g s" data-copy="${m.n}">${ic('copy')}Salin</button></div>${m.k=='PayPal'?'<div class="mut" style="margin-top:6px">Kirim setara USD sesuai kurs hari ini.</div>':''}</div>
 <div><label>Nama pengirim / catatan</label><input type="text" id="f9" placeholder="Contoh: Budi, BCA"></div>
 <button class="btn ok" data-pay="${k}" data-total="${tot}">${ic('paper-plane')}Saya sudah bayar</button>
 <div class="mut" style="text-align:center">Paket aktif setelah pembayaran diverifikasi admin.</div><button class="btn g" data-act="close">Batal</button>`)}
function ui(){if($('#app').classList.contains('hide')||tab=='set'||!$('#sheet').classList.contains('hide'))return;const y=scrollY;render();scrollTo(0,y)}
const ids=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const ADMIN_EMAIL='abdullohfajar110@gmail.com';let mail='';const isAdmin=()=>mail===ADMIN_EMAIL;
function sync(u){uid=u.uid;mail=(u.email||'').toLowerCase();user=u.displayName||nm(u.email||'');const ur=db.doc('users/'+uid);
 unsub=[ur.onSnapshot(d=>{if(!d.exists)ur.set({name:user,plan:'free',exp:0,prof:{},at:Date.now()}).catch(fe);const x=d.data()||{};S.plan=x.plan||'free';S.exp=x.exp||0;S.prof=x.prof||{};ui()},fe),
 db.collection('payments').where('uid','==',uid).onSnapshot(q=>{S.tx=ids(q).sort((a,b)=>a.at-b.at);ui()},fe),
 db.collection('items').orderBy('at','desc').limit(100).onSnapshot(q=>{S.market=ids(q);S.items=S.market.filter(i=>i.owner===uid);ui()},fe),
 db.collection('ads').orderBy('at','desc').limit(100).onSnapshot(q=>{S.sponsor=ids(q);S.ads=S.sponsor.filter(a=>a.owner===uid);ui()},fe),
 db.collection('auctions').orderBy('at','desc').limit(100).onSnapshot(q=>{S.auc=ids(q);ui()},fe)];
 if(isAdmin())unsub.push(db.collection('payments').where('status','==','menunggu').onSnapshot(q=>{S.pend=ids(q);ui()},fe))}
function enter(){$('#login').classList.add('hide');$('#app').classList.remove('hide');go('home')}
const nm=v=>(v.split('@')[0]||'Pengguna').replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const AE={'auth/invalid-credential':'Email atau kata sandi salah.','auth/email-already-in-use':'Email sudah terdaftar.','auth/weak-password':'Kata sandi minimal 6 karakter.','auth/invalid-email':'Format email tidak valid.','auth/network-request-failed':'Tidak ada koneksi internet.'};
async function authGo(reg){const e=$('#em').value.trim(),p=$('#pw').value,er=$('#err');er.textContent='';
 if(!READY)return er.textContent='Isi dulu konfigurasi Firebase (CFG) di file ini.';
 if(!e||!p)return er.textContent='Isi email dan kata sandi.';
 try{if(reg){const c=await auth.createUserWithEmailAndPassword(e,p);await c.user.updateProfile({displayName:nm(e)});await db.doc('users/'+c.user.uid).set({name:nm(e),plan:'free',exp:0,prof:{},at:Date.now()})}else await auth.signInWithEmailAndPassword(e,p)}catch(x){er.textContent=AE[x.code]||x.message}}
$('#go').onclick=()=>authGo(false);$('#reg').onclick=()=>authGo(true);
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=()=>auth&&auth.signOut();
document.addEventListener('change',e=>{const t=e.target.dataset.tg;if(t)db.doc('users/'+uid).set({prof:{['t_'+t]:e.target.checked}},{merge:true}).catch(fe)});
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let x;
 if(x=q('[data-copy]')){navigator.clipboard&&navigator.clipboard.writeText(x.dataset.copy).then(()=>toast('Tersalin'));return}
 if(x=q('[data-go]'))return go(x.dataset.go);
 if(q('[data-open]')){$('#wms').classList.remove('hide');document.body.style.overflow='hidden';return}
 if(x=q('[data-pt]')){pasarTab=x.dataset.pt;return render()}
 if(x=q('[data-lt]')){lelTab=x.dataset.lt;return render()}
 if(x=q('[data-cy]')){cycle=x.dataset.cy;return render()}
 if(x=q('[data-buy]'))return checkout(x.dataset.buy);
 if(x=q('[data-m]')){pick=x.dataset.m;return checkout(x.dataset.k)}
 if(x=q('[data-pay]')){const k=x.dataset.pay,v=PLANS[k],base=cycle=='m'?v.m:v.m*10;
  db.collection('payments').add({uid,name:user,email:mail,plan:k,pn:v.n,cycle,base,amount:+x.dataset.total,method:pick,note:($('#f9')||{}).value||'',status:'menunggu',at:Date.now()}).then(()=>toast('Menunggu verifikasi admin')).catch(fe);uc=0;closeSheet();return}
 if(x=q('[data-del]')){db.collection(x.dataset.del=='ad'?'ads':'items').doc(x.dataset.id).delete().catch(fe);return}
 if(x=q('[data-act]')){const a=x.dataset.act,v=id=>($('#'+id)||{}).value;
  if(a=='close')return closeSheet();
  if(a=='newitem')return itemForm();
  if(a=='newad')return adForm();
  if(a=='saveitem'){if(!v('f1')||!(+v('f2')>0))return toast('Isi nama dan harga');if(S.items.length>=P().list)return toast('Batas produk tercapai, upgrade paket');
   db.collection('items').add({n:v('f1'),p:+v('f2'),s:+v('f3')||0,c:v('f4'),owner:uid,ownerName:user,at:Date.now()}).catch(fe);closeSheet();return}
  if(a=='savead'){if(!v('f1'))return toast('Judul wajib diisi');if(adsOn()>=P().ads)return toast('Kuota iklan penuh, upgrade paket');
   db.collection('ads').add({t:v('f1'),d:v('f2')||'',k:v('f3'),end:Date.now()+(Math.max(1,+v('f4')||7))*864e5,owner:uid,ownerName:user,at:Date.now()}).catch(fe);closeSheet();return}
  if(a=='approve'||a=='reject'){const pm=S.pend.find(i=>i.id===x.dataset.id);if(!pm)return;const pr=db.doc('payments/'+pm.id);
   if(a=='reject'){pr.update({status:'ditolak'}).catch(fe);return}
   const ur=db.doc('users/'+pm.uid);
   db.runTransaction(async t=>{const u=(await t.get(ur)).data()||{},now=Date.now(),base=(u.plan==pm.plan&&u.exp>now)?u.exp:now;
    t.set(ur,{plan:pm.plan,exp:base+(pm.cycle=='m'?30:365)*864e5},{merge:true});t.update(pr,{status:'lunas'})}).then(()=>toast('Pembayaran disetujui')).catch(fe);return}
  if(a=='newauc')return aucForm();
  if(a=='saveauc'){const h=+v('f5')||24;if(!v('f1')||!(+v('f3')>0)||!(+v('f4')>0))return toast('Isi nama, harga awal, dan kelipatan');if(aucAct()>=P().auc)return toast('Kuota lelang penuh, upgrade paket');
   db.collection('auctions').add({t:v('f1'),d:v('f2')||'',start:+v('f3'),step:+v('f4'),cur:+v('f3'),bids:[],end:Date.now()+Math.max(1,h)*36e5,owner:uid,ownerName:user,done:false,at:Date.now()}).catch(fe);closeSheet();return}
  if(a=='bid'||a=='endauc'){const ref=db.doc('auctions/'+x.dataset.id);
   db.runTransaction(async t=>{const au=(await t.get(ref)).data();
    if(a=='endauc'){if(au.owner!==uid)throw Error('Bukan lelangmu');t.update(ref,{done:true});return}
    if(au.done||au.end<=Date.now())throw Error('Lelang sudah berakhir');
    if(au.owner===uid)throw Error('Tidak bisa menawar lelang sendiri');
    const nx=au.bids.length?au.cur+au.step:au.start;
    t.update(ref,{cur:nx,bids:firebase.firestore.FieldValue.arrayUnion({by:user,uid,a:nx,at:Date.now()})})}).then(()=>a=='bid'&&toast('Bid berhasil')).catch(fe);return}
  if(a=='saveprof'){const pf={};document.querySelectorAll('[data-pf]').forEach(i=>pf[i.dataset.pf]=i.value);db.doc('users/'+uid).set({prof:pf},{merge:true}).then(()=>toast('Perubahan disimpan')).catch(fe);return}}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#back').onclick=()=>{$('#wms').classList.add('hide');document.body.style.overflow=''};
setInterval(()=>{document.querySelectorAll('[data-end]').forEach(e=>{const m=+e.dataset.end-Date.now();if(m>0)e.textContent=left(m);else{e.removeAttribute('data-end');e.textContent='Selesai';if(tab=='lelang'&&$('#sheet').classList.contains('hide'))render()}})},1000);
if(READY)auth.onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];
 if(u){sync(u);enter()}else{S=EMPTY();uid=user='';$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').value=''}});
</script>
</body>
</html>

.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--pu),var(--pu2));margin-bottom:6px}

label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}label input,label textarea,.fi{width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:#fafafa;outline:0;font-size:14px;color:var(--tx)}
label input:focus,label textarea:focus{border-color:var(--pu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--tx);margin:0;cursor:pointer}.sw:last-child{border:0}
.sw input{position:absolute;opacity:0;width:0}.sw i{width:44px;height:25px;border-radius:99px;background:#d1d5db;position:relative;flex:none;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--pu)}.sw input:checked+i:after{left:22px}
.bi{display:flex;gap:14px;align-items:center}.bi .av{margin:0}

dialog{border:0;border-radius:20px;padding:18px;width:min(92vw,440px)}dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}#toast.on{opacity:1;transform:translate(-50%,0)}
#gate{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:40;background:var(--bg)}
@media(max-width:480px){.g2{grid-template-columns:1fr}.gr{grid-template-columns:1fr 1fr}.sl h3{font-size:20px}}
</style>
</head>

profil(){const c=S.co||{},row=(i,t,a)=>`<button class="row" data-sv="${a}"><i class="fa-solid ${i}"></i><span>${t}</span><i class="fa-solid fa-chevron-right"></i></button>`;
 return `<div class="cb bi"><div class="av">${av(c)}</div><div><b style="font-size:17px">${esc(c.name||me.displayName||me.email)}</b><br><span class="mu">${esc(me.email)}</span><br>${c.verified?`<span class="tag">Verified ${esc(c.verified)}</span>`:'<span class="tag m">Belum terverifikasi</span>'}</div></div>
 <div class="cb"><label class="sw">Mode Pemilik Gudang (tampilkan statistik)<input type="checkbox" id="md" ${S.mode=='owner'?'checked':''}><i></i></label></div>`
 +row('fa-building','Profil Perusahaan & Legalitas','edit')+row('fa-users','Manajemen Pengguna & Akses','user')+row('fa-crown','Langganan Premium','sub')+row('fa-lock','Keamanan & Kata Sandi','sec')
 +`<a class="row" href="index.html"><i class="fa-solid fa-warehouse"></i><span>Kembali ke Gudangku</span><i class="fa-solid fa-chevron-right"></i></a>`},
edit(){const c=S.co||{},l=S.legal||{},ck=(k,d)=>(c[k]===undefined?d:c[k])?'checked':'',st=n=>c.verified&&l[n]?'<span class="tag">Terverifikasi aktif</span>':l[n]?'<span class="tag w">Menunggu verifikasi</span>':'<span class="tag m">Belum diisi</span>';
 return hd('Profil & Legalitas')+`<div class="cb"><h3><i class="fa-solid fa-building"></i> Informasi Perusahaan</h3><div class="g2"><label>Nama PT / usaha<input id="f-n" maxlength="60" value="${esc(c.name)}"></label><label>Bidang usaha<input id="f-b" maxlength="100" value="${esc(c.bidang)}"></label>
 <label>Alamat kantor<input id="f-a" maxlength="140" value="${esc(c.alamat)}"></label><label>Nomor kontak<input id="f-k" maxlength="30" value="${esc(c.kontak)}"></label><label>WhatsApp sales (mis. 0812…)<input id="f-w" maxlength="20" inputmode="tel" value="${esc(c.wa)}"></label></div></div>
 <div class="cb"><h3><i class="fa-solid fa-file-shield"></i> Dokumen Legalitas (B2B)</h3><p class="mu" style="margin-bottom:10px">Hanya Anda dan admin yang bisa melihat nomor ini. Lencana Verified diberikan admin setelah diperiksa.</p>
 <label>NIB ${st('nib')}<input id="f-nib" maxlength="30" value="${esc(l.nib)}"></label><label>NPWP ${st('npwp')}<input id="f-npwp" maxlength="30" value="${esc(l.npwp)}"></label><label>SIUP ${st('siup')}<input id="f-siup" maxlength="30" value="${esc(l.siup)}"></label></div>
 <div class="cb"><h3><i class="fa-solid fa-bullhorn"></i> Tampilan Iklan & Mitra</h3><label class="sw">Tampilkan profil di Pasar B2B<input type="checkbox" id="f-sp" ${ck('showProfile',false)}><i></i></label><label class="sw">Aktifkan Hubungi Sales via WhatsApp<input type="checkbox" id="f-sw" ${ck('showWa',false)}><i></i></label><label class="sw">Tampilkan produk utama di Hub<input type="checkbox" id="f-pd" ${ck('showProducts',true)}><i></i></label></div>
 <button class="pb" data-a="save" style="width:100%"><i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan</button>`},
user(){const o=S.W.filter(w=>(w.members[me.uid]||{}).role=='owner');return hd('Pengguna & Akses')+(o.length?o.map(w=>`<div class="cb"><h3><i class="fa-solid fa-warehouse"></i> ${esc(w.name)}</h3>${Object.values(w.members).map(m=>`<div class="sw" style="cursor:default"><span><i class="fa-solid fa-user"></i> ${esc(m.name||m.email)}<br><span class="mu">${esc(m.email||'')}</span></span><span class="tag ${m.role=='owner'?'w':''}">${m.role=='owner'?'Pemilik':'Karyawan'}</span></div>`).join('')}</div>`).join(''):'<div class="em">Anda belum memiliki gudang.</div>')+'<a class="pb" href="index.html"><i class="fa-solid fa-user-plus"></i> Undang karyawan di Gudangku</a>'},
sub(){return hd('Langganan Premium')+`<div class="cb"><h3><i class="fa-solid fa-crown"></i> Status</h3><p>${prem()?`<span class="tag">Aktif</span> Berlaku sampai <b>${dt(S.until)}</b>`:'<span class="tag m">Belum aktif</span> Aktifkan untuk berjualan, membeli, dan mengirim RFQ.'}</p><p class="mu" style="margin:8px 0 12px">Bayar lewat Midtrans atau transfer manual (BCA, DANA, OVO, PayPal) di aplikasi Gudangku: tab Pasar → Premium.</p><a class="pb" href="index.html"><i class="fa-solid fa-credit-card"></i> Buka halaman pembayaran</a></div>`},
sec(){return hd('Keamanan & Kata Sandi')+`<div class="cb"><p class="mu" style="margin-bottom:12px">Akun: ${esc(me.email)}</p><div class="bt"><button class="gb" data-a="reset"><i class="fa-solid fa-key"></i> Kirim email reset kata sandi</button><button class="gb" data-a="out" style="color:#ef4444"><i class="fa-solid fa-right-from-bracket"></i> Keluar akun</button></div></div>`}};
const nav=()=>{$('#nv').innerHTML=NV.map(x=>x[0]=='rfq'?`<button class="fab ${S.v=='rfq'?'on':''}" data-v="rfq" aria-label="Pesan"><i class="fa-regular fa-comment-dots"></i>${S.R.length?`<em class="bd">${S.R.length}</em>`:''}</button>`:`<button class="${x[0]==S.v&&!S.pid?'on':''}" data-v="${x[0]}"><i class="fa-solid ${x[1]}"></i>${x[2]}</button>`).join('')};
let raf=0;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(!me)return;const f=document.activeElement;if(f&&$('#v').contains(f)&&/INPUT|TEXTAREA/.test(f.tagName))return;
 const y=scrollY,k=S.pid?'partner':S.v=='profil'&&S.sv?S.sv:S.v;$('#v').innerHTML=V[k]();nav();scrollTo(0,y)})}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a],[data-v],[data-sv],[data-go]');if(!t||!me)return;const d=t.dataset;
 if(d.v){S.v=d.v;S.pid=null;S.sv=null;if(d.v!='katalog'&&d.v!='hub')S.cat='';render();scrollTo(0,0)}
 else if(d.sv){S.sv=d.sv;render();scrollTo(0,0)}
 else if(d.go){if(d.go=='team')location.href='index.html';else{S.v='profil';S.sv=d.go;S.pid=null;render();scrollTo(0,0)}}
 else if(d.a=='visit'){S.pid=d.id;render();scrollTo(0,0)}
 else if(d.a=='back'){if(S.pid)S.pid=null;else S.sv=null;if(S.v=='rfq')S.v='hub';render()}
 else if(d.a=='cat'){S.cat=S.cat==d.j?'':d.j;if(S.v=='hub')S.v='katalog';render()}
 else if(d.a=='flt'){S.fv=!S.fv;render();toast(S.fv?'Hanya yang terverifikasi':'Semua perusahaan')}
 else if(d.a=='rfq'){if(!prem())return toast('Aktifkan Premium dulu untuk mengirim RFQ');const g=$('#dlg');g.dataset.to=d.id;g.dataset.tn=d.n;$('#dt2').textContent='Kepada: '+d.n;$('#dm').value=d.p?'Halo, saya tertarik dengan '+d.p+'. Mohon penawaran harga dan ketersediaan untuk jumlah ... kotak.':'';g.showModal()}
 else if(d.a=='save')save();else if(d.a=='reset')Au.sendPasswordResetEmail(auth,me.email).then(()=>toast('Email reset dikirim ke '+me.email)).catch(x=>toast(x.message));else if(d.a=='out')Au.signOut(auth)});
document.addEventListener('change',e=>{if(e.target.id=='md'){S.mode=e.target.checked?'owner':'viewer';try{localStorage.setItem('dash-mode',S.mode)}catch(x){}}});
$('#v').addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;const r=$('#res');if(r)r.innerHTML=R[S.v]()}});
document.addEventListener('scroll',e=>{if(e.target.id!='bn')return;const b=e.target,i=Math.round(b.scrollLeft/b.clientWidth);[...$('#dt').children].forEach((d,j)=>d.classList.toggle('on',j==i))},true);
$('#dc').onclick=()=>$('#dlg').close();
$('#ds').onclick=async()=>{const g=$('#dlg'),x=$('#dm').value.trim();if(!x)return toast('Isi pesan dulu');
 try{await addDoc(collection(db,'gudang_rfqs'),{fromUid:me.uid,fromName:(S.co&&S.co.name)||me.displayName||me.email,fromEmail:me.email,toUid:g.dataset.to,toName:g.dataset.tn||'',text:x,status:'baru',createdAt:serverTimestamp()});g.close();toast('RFQ terkirim')}catch(err){toast(err.code=='permission-denied'?'Tidak ada izin (cek Premium)':err.message)}};
async function save(){const v=i=>$('#'+i).value.trim(),n=v('f-n');if(!n)return toast('Isi nama perusahaan');
 try{await setDoc(doc(db,'gudang_companies',me.uid),{uid:me.uid,name:n,bidang:v('f-b'),alamat:v('f-a'),kontak:v('f-k'),wa:v('f-w'),showProfile:$('#f-sp').checked,showWa:$('#f-sw').checked,showProducts:$('#f-pd').checked,updatedAt:serverTimestamp()},{merge:true});
  await setDoc(doc(db,'gudang_company_legal',me.uid),{nib:v('f-nib'),npwp:v('f-npwp'),siup:v('f-siup'),updatedAt:serverTimestamp()},{merge:true});S.legal={nib:v('f-nib'),npwp:v('f-npwp'),siup:v('f-siup')};toast('Profil disimpan');render()}catch(err){toast(err.code=='permission-denied'?'Tidak punya izin':err.message)}}
Au.onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];me=u;
 if(!u)return gate('<div><i class="fa-solid fa-user-lock" style="font-size:30px;color:#7a12f5"></i><p style="margin:10px 0 14px">Masuk dulu lewat aplikasi Gudangku.</p><a class="pb" href="index.html"><i class="fa-solid fa-right-to-bracket"></i> Buka Gudangku</a></div>');
 $('#gate').hidden=true;$('#app').hidden=false;$('#nv').hidden=false;const er=x=>console.warn(x.code),on=(q,f)=>un.push(onSnapshot(q,s=>{f(s);render()},er));
 on(query(collection(db,'gudang_companies'),where('showProfile','==',true)),s=>S.P=s.docs.map(d=>({uid:d.id,...d.data()})));
 on(doc(db,'gudang_companies',u.uid),s=>S.co=s.exists()?s.data():null);
 on(query(collection(db,'gudang_listings'),where('status','==','active')),s=>S.L=s.docs.map(d=>({id:d.id,...d.data()})));
 on(query(collection(db,'gudang_rfqs'),where('toUid','==',u.uid)),s=>S.R=s.docs.map(d=>d.data()).sort((a,b)=>tms(b.createdAt)-tms(a.createdAt)));
 on(query(collection(db,'gudang_orders'),where('buyerUid','==',u.uid)),s=>S.O=s.docs.map(d=>d.data()));
 on(query(collection(db,'gudang_warehouses'),where('memberUids','array-contains',u.uid)),s=>S.W=s.docs.map(d=>({id:d.id,...d.data()})));
 on(doc(db,'gudang_subs',u.uid),s=>S.until=s.exists()&&s.data().until?s.data().until.toMillis():0);
 try{const g=await getDoc(doc(db,'gudang_company_legal',u.uid));S.legal=g.exists()?g.data():{}}catch(x){}render()});
})();
</script>
</body>
</html>

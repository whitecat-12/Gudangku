<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>Bifetindo WMS — Pasar B2B Industri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#0b1b33; --ink2:#14294a; --mut:#5b7295; --mut2:#8ba0bf;
  --line:#dbe7f5; --line2:#c5d8ee; --paper:#ffffff; --paper2:#f6faff; --field:#f1f7fe;
  --brand:#2563eb; --brand2:#0ea5e9; --brand3:#6366f1;
  --mint:#10b981; --sun:#f59e0b; --rose:#ef4444;
  --sh:0 1px 2px rgba(11,27,51,.05),0 10px 30px -14px rgba(11,27,51,.18);
  --sh2:0 2px 4px rgba(11,27,51,.06),0 24px 48px -22px rgba(11,27,51,.30);
  --sh3:0 2px 4px rgba(11,27,51,.06),0 40px 80px -32px rgba(11,27,51,.40);
  --r:20px; color-scheme:light;
  --nav-h:64px;
  --nav-icon:22px;
  --nav-font:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;max-width:100%;min-height:100%}
html{overflow-x:hidden;overflow-x:clip;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:#eaf2fc;
  overflow-x:hidden;
  overflow-x:clip;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1100px 620px at 100% -10%, #cfe6ff 0%, transparent 60%),
    radial-gradient(900px 540px at -10% 0%, #d8f3ff 0%, transparent 55%),
    radial-gradient(800px 540px at 50% 110%, #e8e0ff 0%, transparent 55%),
    linear-gradient(180deg,#eaf2fc 0%,#e2edfa 100%);
}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
::selection{background:#bfdbfe;color:#0b1b33}
h1,h2,h3{font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;letter-spacing:-.03em}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

.btn{border:0;border-radius:15px;padding:14px 18px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 45%,#0ea5e9 100%);
  color:#fff;width:100%;cursor:pointer;display:inline-flex;gap:9px;align-items:center;justify-content:center;
  box-shadow:0 8px 22px -12px rgba(37,99,235,.9),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .18s cubic-bezier(.2,.8,.25,1), box-shadow .18s ease, filter .18s ease;
  position:relative;overflow:hidden;max-width:100%}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s ease}
.btn:hover{filter:brightness(1.05)}
.btn:hover:after{transform:translateX(120%)}
.btn:active{transform:translateY(1px) scale(.994)}
.btn.g{background:var(--paper);color:var(--ink);border:1px solid var(--line2);box-shadow:0 1px 2px rgba(11,27,51,.05)}
.btn.g:hover{background:#f8fbff;border-color:#a9c6e6}
.btn.s{width:auto;padding:10px 15px;font-size:13px;border-radius:12px;gap:8px}
.btn.ok{background:linear-gradient(135deg,#047857,#10b981);box-shadow:0 8px 22px -12px rgba(16,185,129,.9)}
.btn.danger{background:linear-gradient(135deg,#b91c1c,#ef4444);box-shadow:0 8px 22px -12px rgba(239,68,68,.9)}

.brandmark{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.03em;min-width:0}
.brandmark>span{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none;
  background:linear-gradient(135deg,#1e40af 0%,#2563eb 50%,#22d3ee 100%);
  box-shadow:0 10px 24px -12px rgba(37,99,235,1),inset 0 1px 0 rgba(255,255,255,.3);position:relative;}
.brandmark>span:after{content:"";position:absolute;inset:1px;border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.brandmark small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.brandmark>div{min-width:0}

label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.005em}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{
  width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;outline:0;
  transition:border-color .16s,box-shadow .16s,background .16s;color:var(--ink);font-size:14.5px;max-width:100%}
input::placeholder,textarea::placeholder{color:#9db0c8}
input:focus,select:focus,textarea:focus{border-color:#7fb0f0;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
select option{color:var(--ink);background:#fff}
.err{color:var(--rose);font-size:12.5px;min-height:18px;font-weight:600}

#login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
  width:100%;max-width:430px;margin:0 auto;gap:10px;
  position:relative;overflow:hidden;isolation:isolate}
#login::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(500px 340px at 110% 0%, rgba(14,165,233,.22), transparent 60%),
    radial-gradient(440px 300px at -10% 100%, rgba(99,102,241,.18), transparent 60%);}
#login>*{position:relative;z-index:1}
.brand-top{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17.5px;letter-spacing:-.03em;
  align-self:stretch;padding:0 2px;margin-bottom:2px;min-width:0}
.brand-top>span{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none;
  background:linear-gradient(135deg,#1e40af 0%,#2563eb 50%,#22d3ee 100%);
  box-shadow:0 10px 22px -12px rgba(37,99,235,1),inset 0 1px 0 rgba(255,255,255,.3);}
.brand-top small{display:block;font-size:9.5px;color:var(--mut);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.brand-top>div{min-width:0}
.auth-card{background:rgba(255,255,255,.9);
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  border:1px solid rgba(255,255,255,.95);border-radius:24px;padding:18px 16px 16px;box-shadow:var(--sh3);
  display:grid;gap:10px;width:100%;animation:pop .45s cubic-bezier(.2,.8,.25,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.auth-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px;min-width:0}
.auth-head>div{min-width:0}
.auth-head h1{font-size:21px;margin:0;font-weight:800;line-height:1.1;letter-spacing:-.035em}
.auth-head p{color:var(--mut);margin:4px 0 0;font-size:12px;line-height:1.45}
.auth-pill{display:inline-flex;align-items:center;gap:5px;flex:none;
  background:linear-gradient(135deg,#e0ecff,#e6f7ff);color:#1d4ed8;font-size:10px;font-weight:800;letter-spacing:.03em;
  padding:5px 9px;border-radius:99px;border:1px solid #cfe0fb;white-space:nowrap;}
.auth-tabs{display:flex;background:#e4edf9;border:1px solid var(--line);border-radius:14px;padding:4px;gap:3px;margin-bottom:2px}
.auth-tabs button{flex:1;border:0;background:none;padding:11px 8px;border-radius:11px;font-weight:700;font-size:12.5px;
  color:var(--mut);cursor:pointer;transition:background .16s,color .16s,box-shadow .16s;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-tabs button.on{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px -2px rgba(11,27,51,.18)}
.auth-form{display:grid;gap:9px}
.auth-field label{margin-bottom:4px;font-size:11px;letter-spacing:.01em}
.auth-field input{padding:11px 13px;font-size:14px;border-radius:12px}
.auth-actions .btn{padding:12px 14px;font-size:14px;border-radius:13px}
.auth-actions .btn.g{padding:11px 14px}
.auth-form .btn{padding:12px 14px;font-size:14px;border-radius:13px}
.auth-divider{display:flex;align-items:center;gap:10px;color:#a3b6ce;font-size:10px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;margin:1px 0;}
.auth-divider:before,.auth-divider:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#d3e2f3,transparent)}
.auth-foot{text-align:center;font-size:10.5px;color:var(--mut);line-height:1.6;max-width:400px;padding:0 4px}
.auth-foot a{color:var(--brand);font-weight:700;text-decoration:none}
.auth-foot a:hover{text-decoration:underline}

#app{
  min-height:100vh;min-height:100dvh;
  width:100%;max-width:760px;margin:0 auto;
  padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));
  position:relative;
}
header{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 16px;
  background:rgba(234,242,252,.78);
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid rgba(197,216,238,.5);
  min-width:0;
}
header .brandmark{font-size:16px;flex:1 1 auto;min-width:0}
header .brandmark>span{width:34px;height:34px;border-radius:11px;font-size:13px}
header #ttl{
  font-weight:800;letter-spacing:-.03em;
  font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;
  font-size:15.5px;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
header #out{flex:none}
main{padding:16px 14px;display:grid;gap:14px;align-content:start;min-width:0;width:100%}
main>*{min-width:0}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
h2{font-size:19px;margin:0;font-weight:800}
h3{font-size:14.5px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h3 i{color:var(--brand);font-size:13px}
.mut{color:var(--mut);font-size:12.5px;line-height:1.5}
.mut i{color:var(--mut2);margin-right:4px}

.home-top{display:grid;gap:11px;min-width:0}
.greet{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.greet-info{min-width:0;flex:1 1 auto}
.greet-hi{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.02em;display:block;margin-bottom:2px}
.greet h2{font-size:21px;margin:0;letter-spacing:-.04em;font-weight:800;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-btn{position:relative;width:42px;height:42px;border-radius:13px;flex:none;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  display:grid;place-items:center;cursor:pointer;font-size:15px;
  box-shadow:var(--sh);transition:transform .16s,box-shadow .16s;}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.icon-btn:active{transform:scale(.96)}
.icon-btn .dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;
  background:var(--rose);border:2px solid #fff}

.search-bar{display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:6px 6px 6px 14px;box-shadow:var(--sh);
  transition:border-color .16s,box-shadow .16s;min-width:0}
.search-bar:focus-within{border-color:#7fb0f0;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
.search-bar>i{color:var(--mut);font-size:14px;flex:none}
.search-bar input{flex:1 1 auto;border:0!important;background:none!important;padding:10px 0!important;
  font-size:14px!important;outline:none;box-shadow:none!important;border-radius:0!important;
  color:var(--ink);min-width:0}
.search-bar input:focus{box-shadow:none!important;background:none!important;border:0!important}
.search-filter{width:36px;height:36px;border-radius:11px;flex:none;border:0;cursor:pointer;
  background:linear-gradient(135deg,#e0ecff,#eff6ff);color:var(--brand);
  display:grid;place-items:center;font-size:13px;transition:transform .16s;}
.search-filter:active{transform:scale(.94)}

.promo{position:relative;border-radius:22px;padding:18px 16px;padding-right:120px;
  background:
    radial-gradient(500px 280px at 100% 0%, rgba(34,211,238,.45), transparent 60%),
    linear-gradient(135deg,#0b2545 0%,#1d4ed8 55%,#0891b2 100%);
  color:#fff;overflow:hidden;
  box-shadow:0 20px 40px -20px rgba(29,78,216,.85),inset 0 1px 0 rgba(255,255,255,.15);
  min-width:0}
.promo:before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse at 100% 0%,#000 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 100% 0%,#000 0%,transparent 70%);}
.promo>*{position:relative;z-index:1}
.promo-badge{display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);
  padding:4px 10px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;margin-bottom:8px;backdrop-filter:blur(6px);}
.promo-badge i{color:#fde68a;font-size:10px}
.promo h3{font-size:17px;margin:0 0 4px;letter-spacing:-.03em;color:#fff;font-weight:800;line-height:1.2}
.promo p{font-size:11.5px;color:#cfe6ff;margin:0 0 12px;line-height:1.4;max-width:180px}
.promo-btn{width:auto;border:0;border-radius:11px;padding:9px 16px;
  background:#fff;color:#1d4ed8;font-weight:800;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  box-shadow:0 8px 16px -8px rgba(0,0,0,.35);transition:transform .16s,box-shadow .16s;}
.promo-btn:hover{transform:translateY(-1px);box-shadow:0 12px 20px -8px rgba(0,0,0,.4)}
.promo-btn:active{transform:scale(.97)}
.promo-art{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-9deg);
  width:88px;height:88px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(255,255,255,.32),rgba(255,255,255,.10));
  border:1px solid rgba(255,255,255,.35);color:#fff;font-size:36px;
  box-shadow:0 20px 40px -16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}

.section-title{font-size:14px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}

.quick-wrap{position:relative;min-width:0;width:100%}
.quick{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding:0 2px 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  min-width:0;max-width:100%}
.quick::-webkit-scrollbar{display:none}
.q-item{flex:0 0 72px;width:72px;background:none;border:0;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.q-ic{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-size:21px;
  position:relative;box-shadow:0 6px 14px -8px rgba(37,99,235,.3),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .18s;}
.q-item:hover .q-ic{transform:translateY(-3px);box-shadow:0 12px 20px -8px rgba(37,99,235,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.q-item:active .q-ic{transform:translateY(0) scale(.96)}
.q-item small{font-size:10.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;
  text-align:center;line-height:1.2;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.q-ic.blue{background:linear-gradient(135deg,#dbeafe,#eff6ff);color:#1d4ed8}
.q-ic.cyan{background:linear-gradient(135deg,#cffafe,#ecfeff);color:#0891b2}
.q-ic.indigo{background:linear-gradient(135deg,#e0e7ff,#eef2ff);color:#4338ca}
.q-ic.sky{background:linear-gradient(135deg,#e0f2fe,#f0f9ff);color:#0284c7}
.q-ic.teal{background:linear-gradient(135deg,#ccfbf1,#f0fdfa);color:#0d9488}
.q-ic.navy{background:linear-gradient(135deg,#dbeafe,#eef2ff);color:#1e3a8a}

.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0;width:100%}
.mini-stat{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:11px 6px;text-align:center;box-shadow:var(--sh);
  position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s;
  min-width:0}
.mini-stat:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#2563eb,#0ea5e9,#22d3ee);opacity:.85;}
.mini-stat b{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;
  line-height:1.15;color:var(--ink);
  font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-stat small{display:block;font-size:9px;color:var(--mut);font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-width:0;width:100%}
.shortcut{background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:13px;text-align:left;cursor:pointer;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:6px;min-width:0;
  transition:transform .18s cubic-bezier(.2,.8,.25,1),box-shadow .18s,border-color .18s;
  position:relative;overflow:hidden;}
.shortcut:before{content:"";position:absolute;inset:0;
  background:radial-gradient(320px 160px at 100% 0%, rgba(37,99,235,.06), transparent 60%);
  opacity:0;transition:opacity .2s;pointer-events:none}
.shortcut:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:#b9d3f2}
.shortcut:hover:before{opacity:1}
.shortcut:active{transform:translateY(0) scale(.99)}
.shortcut .sc-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  font-size:15px;margin-bottom:2px;position:relative;z-index:1;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
.shortcut .sc-ic.blue{background:linear-gradient(135deg,#dbeafe,#eff6ff);color:#1d4ed8}
.shortcut .sc-ic.cyan{background:linear-gradient(135deg,#cffafe,#ecfeff);color:#0891b2}
.shortcut .sc-ic.sky{background:linear-gradient(135deg,#e0f2fe,#f0f9ff);color:#0284c7}
.shortcut .sc-ic.indigo{background:linear-gradient(135deg,#e0e7ff,#eef2ff);color:#4338ca}
.shortcut b{font-size:12.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink);position:relative;z-index:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shortcut small{font-size:10.5px;color:var(--mut);line-height:1.35;position:relative;z-index:1;min-width:0}

.hero{background:
    radial-gradient(700px 380px at 100% 0%, rgba(34,211,238,.35), transparent 60%),
    radial-gradient(600px 340px at 0% 100%, rgba(99,102,241,.30), transparent 60%),
    linear-gradient(135deg,#0b2545 0%,#1d4ed8 55%,#0891b2 100%);
  color:#fff;border:0;border-radius:24px;padding:22px;
  box-shadow:0 24px 48px -24px rgba(11,37,69,.75),inset 0 1px 0 rgba(255,255,255,.15);
  position:relative;overflow:hidden;min-width:0}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:22px;letter-spacing:-.04em;margin-bottom:6px}
.hero .mut{color:#bfdbfe;font-size:13px}
.hero .mut b{color:#fff}

let lang="id";
try{const sv=localStorage.getItem("bifetindo.lang");if(sv&&LANGS.some(l=>l.c===sv))lang=sv}catch(e){}
const LIX=()=>{const i=LANGS.findIndex(l=>l.c===lang);return i<0?0:i};
const t=(k,...a)=>{const r=D[k];let s=r?(r[LIX()]!==undefined?r[LIX()]:r[0]):k;
  for(let i=0;i<a.length;i++)s=String(s).split("{"+i+"}").join(a[i]);return s};
const lc=()=>lang.toUpperCase();

function paintStatic(){
  document.documentElement.setAttribute("lang",lang);
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>{e.placeholder=t(e.dataset.i18nPh)});
  ["#langcur","#langcur2"].forEach(s=>{const e=$(s);if(e)e.textContent=lc()});
  const lg=$("#legal");
  if(lg)lg.innerHTML=t("legal")+' <a href="#">'+t("legal.terms")+'</a> '+t("legal.and")+' <a href="#">'+t("legal.privacy")+'</a>.';
}
function setLang(c){
  if(!LANGS.some(l=>l.c===c))return;
  lang=c;
  try{localStorage.setItem("bifetindo.lang",c)}catch(e){}
  paintStatic();
  if(uid&&READY)db.doc("users/"+uid).set({lang:c},{merge:true}).catch(()=>{});
  if(!$("#app").classList.contains("hide"))render();
}
function langSheet(){
  sheet(`<h2>${ic("globe")} ${t("set.lang")}</h2><div class="mut" style="margin:-6px 0 2px">${t("set.lang.d")}</div>
  <div class="lang-grid">${LANGS.map(l=>`<div class="lang-opt ${lang==l.c?"on":""}" data-lang="${l.c}"><span class="fl">${l.f}</span><b>${l.n}</b>${lang==l.c?ic("check"):""}</div>`).join("")}</div>`);
}

async function authGo(reg){
  const erEl = reg ? $('#rerr') : $('#err');
  erEl.textContent='';
  if(!READY)return erEl.textContent=t('e.nocfg');

  if(reg){
    const name = $('#rname').value.trim();
    const e = $('#rem').value.trim();
    const p = $('#rpw').value;
    const p2 = $('#rpw2').value;
    if(!e||!p)return erEl.textContent=t('e.fillall');
    if(p.length<6)return erEl.textContent=t('ae.weak');
    if(p!==p2)return erEl.textContent=t('reg.mismatch');
    try{
      const c = await auth.createUserWithEmailAndPassword(e,p);
      const dn = name || nm(e);
      await c.user.updateProfile({displayName: dn});
      await db.doc('users/'+c.user.uid).set({name: dn, plan:'free', exp:0, prof:{}, lang, at:Date.now()});
    }catch(x){erEl.textContent=AE[x.code]?t(AE[x.code]):(x.message||t('e.generic'))}
  } else {
    const e = $('#em').value.trim();
    const p = $('#pw').value;
    if(!e||!p)return erEl.textContent=t('e.fillall');
    try{
      await auth.signInWithEmailAndPassword(e,p);
    }catch(x){erEl.textContent=AE[x.code]?t(AE[x.code]):(x.message||t('e.generic'))}
  }
}

/* ======================= EVENTS ======================= */
$('#go').onclick=()=>authGo(false);
$('#reg').onclick=()=>authGo(true);
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#rpw2').addEventListener('keydown',e=>{if(e.key==='Enter')$('#reg').click()});
$('#out').onclick=()=>auth&&auth.signOut();
$('#langbtn').onclick=langSheet;
$('#langbtn2').onclick=langSheet;

document.addEventListener('change',e=>{const g=e.target.dataset.tg;
 if(g)db.doc('users/'+uid).set({prof:{['t_'+g]:e.target.checked}},{merge:true}).catch(fe)});

document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let x;
 if(x=q('[data-copy]')){navigator.clipboard&&navigator.clipboard.writeText(x.dataset.copy).then(()=>toast(t('t.copied')));return}
 if(x=q('[data-lang]')){setLang(x.dataset.lang);closeSheet();return}
 if(q('[data-lang-sheet]'))return langSheet();
 if(x=q('[data-auth]')){
  document.querySelectorAll('[data-auth]').forEach(b=>b.classList.toggle('on',b.dataset.auth===x.dataset.auth));
  $('#form-login').classList.toggle('hide',x.dataset.auth!=='login');
  $('#form-register').classList.toggle('hide',x.dataset.auth!=='register');
  $('#err').textContent='';
  $('#rerr').textContent='';
  return;
 }
 if(x=q('[data-go]'))return go(x.dataset.go);
 if(q('[data-open]')){location.href=WMS_URL;return}
 if(x=q('[data-pt]')){pasarTab=x.dataset.pt;return render()}
 if(x=q('[data-lt]')){lelTab=x.dataset.lt;return render()}
 if(x=q('[data-cy]')){cycle=x.dataset.cy;return render()}
 if(x=q('[data-buy]'))return checkout(x.dataset.buy);
 if(x=q('[data-m]')){pick=x.dataset.m;return checkout(x.dataset.k)}
 if(x=q('[data-pay]')){const k=x.dataset.pay,v=PLANS[k],base=cycle=='m'?v.m:v.m*10;
  db.collection('payments').add({uid,name:user,email:mail,plan:k,pn:pname(k),cycle,base,amount:+x.dataset.total,method:pick,note:($('#f9')||{}).value||'',status:'menunggu',at:Date.now()}).then(()=>toast(t('t.pending'))).catch(fe);uc=0;closeSheet();return}
 if(x=q('[data-del]')){db.collection(x.dataset.del=='ad'?'ads':'items').doc(x.dataset.id).delete().catch(fe);return}
 if(x=q('[data-act]')){const a=x.dataset.act,v=id=>($('#'+id)||{}).value;
  if(a=='close')return closeSheet();
  if(a=='newitem')return itemForm();
  if(a=='newad')return adForm();
  if(a=='saveitem'){if(!v('f1')||!(+v('f2')>0))return toast(t('t.fillnp'));if(S.items.length>=P().list)return toast(t('t.limitp'));
   db.collection('items').add({n:v('f1'),p:+v('f2'),s:+v('f3')||0,c:v('f4'),owner:uid,ownerName:user,at:Date.now()}).catch(fe);closeSheet();return}
  if(a=='savead'){if(!v('f1'))return toast(t('t.adtitle'));if(adsOn()>=P().ads)return toast(t('t.limitad'));
   db.collection('ads').add({t:v('f1'),d:v('f2')||'',k:v('f3'),end:Date.now()+(Math.max(1,+v('f4')||7))*864e5,owner:uid,ownerName:user,at:Date.now()}).catch(fe);closeSheet();return}
  if(a=='approve'||a=='reject'){const pm=S.pend.find(i=>i.id===x.dataset.id);if(!pm)return;const pr=db.doc('payments/'+pm.id);
   if(a=='reject'){pr.update({status:'ditolak'}).catch(fe);return}
   const ur=db.doc('users/'+pm.uid);
   db.runTransaction(async tt=>{const u=(await tt.get(ur)).data()||{},now=Date.now(),base=(u.plan==pm.plan&&u.exp>now)?u.exp:now;
    tt.set(ur,{plan:pm.plan,exp:base+(pm.cycle=='m'?30:365)*864e5},{merge:true});tt.update(pr,{status:'lunas'})}).then(()=>toast(t('t.approved'))).catch(fe);return}
  if(a=='newauc')return aucForm();
  if(a=='saveauc'){const h=+v('f5')||24;if(!v('f1')||!(+v('f3')>0)||!(+v('f4')>0))return toast(t('t.fillau'));if(aucAct()>=P().auc)return toast(t('t.limitau'));
   db.collection('auctions').add({t:v('f1'),d:v('f2')||'',start:+v('f3'),step:+v('f4'),cur:+v('f3'),bids:[],end:Date.now()+Math.max(1,h)*36e5,owner:uid,ownerName:user,done:false,at:Date.now()}).catch(fe);closeSheet();return}
  if(a=='bid'||a=='endauc'){const ref=db.doc('auctions/'+x.dataset.id);
   db.runTransaction(async tt=>{const au=(await tt.get(ref)).data();
    if(a=='endauc'){if(au.owner!==uid)throw Error(t('e.notyours'));tt.update(ref,{done:true});return}
    if(au.done||au.end<=Date.now())throw Error(t('e.ended'));
    if(au.owner===uid)throw Error(t('e.own'));
    const nx=au.bids.length?au.cur+au.step:au.start;
    tt.update(ref,{cur:nx,bids:firebase.firestore.FieldValue.arrayUnion({by:user,uid,a:nx,at:Date.now()})})}).then(()=>{if(a=='bid')toast(t('t.bidok'))}).catch(fe);return}
  if(a=='saveprof'){const pf={};document.querySelectorAll('[data-pf]').forEach(i=>pf[i.dataset.pf]=i.value);
   db.doc('users/'+uid).set({prof:pf},{merge:true}).then(()=>toast(t('t.saved'))).catch(fe);return}}});

$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

setInterval(()=>{document.querySelectorAll('[data-end]').forEach(e=>{const m=+e.dataset.end-Date.now();
 if(m>0)e.textContent=left(m);
 else{e.removeAttribute('data-end');e.textContent=t('lel.done');if(tab=='lelang'&&$('#sheet').classList.contains('hide'))render()}})},1000);

/* ======================= BOOT ======================= */
paintStatic();
if(READY)auth.onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];
 if(u){sync(u);enter()}
 else{S=EMPTY();uid=user='';$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').value='';$('#rpw').value='';$('#rpw2').value=''}});
</script>
</body>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bifetindo WMS — Pasar B2B Industri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#eef4fb;
  --bg2:#e3edf9;
  --card:#ffffff;
  --bd:#dbe6f3;
  --bd2:#c9d9ec;
  --tx:#0f2442;
  --mut:#5b7295;
  --ac:#2563eb;
  --ac2:#22d3ee;
  --acsoft:#e8f0fe;
  --ok:#16a34a;
  --wr:#e08a00;
  --er:#dc2626;
  --inp:#f2f7fd;
  --shadow:0 1px 2px rgba(15,36,66,.04),0 8px 24px -12px rgba(15,36,66,.14);
  --shadow2:0 2px 4px rgba(15,36,66,.05),0 18px 40px -18px rgba(15,36,66,.22);
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 520px at 88% -8%, #d6ecff 0%, transparent 60%),
    radial-gradient(900px 480px at -10% 4%, #e2f6ff 0%, transparent 55%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--tx);
  font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
::selection{background:#bfdbfe;color:#0f2442}

/* ---------- shared ---------- */
.btn{
  border:0;border-radius:14px;padding:14px 18px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(135deg,#1d4ed8,#2563eb 45%,#0ea5e9);
  color:#fff;width:100%;cursor:pointer;display:inline-flex;gap:9px;align-items:center;justify-content:center;
  box-shadow:0 6px 16px -8px rgba(37,99,235,.75),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .16s ease, box-shadow .16s ease, filter .16s ease;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn.g{
  background:var(--card);color:var(--tx);border:1px solid var(--bd2);
  box-shadow:0 1px 2px rgba(15,36,66,.05);
}
.btn.g:hover{background:#f7fbff;border-color:#b9cfe8}
.btn.s{width:auto;padding:9px 14px;font-size:13px;border-radius:11px;gap:7px}
.btn.ok{background:linear-gradient(135deg,#15803d,#22c55e);box-shadow:0 6px 16px -8px rgba(34,197,94,.8)}
.btn.danger{background:linear-gradient(135deg,#b91c1c,#ef4444);box-shadow:0 6px 16px -8px rgba(239,68,68,.8)}

.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo>span{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,#1e40af,#2563eb 55%,#22d3ee);
  box-shadow:0 8px 20px -10px rgba(37,99,235,.9),inset 0 1px 0 rgba(255,255,255,.25);
}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:6px;font-weight:600;letter-spacing:.01em}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{
  width:100%;background:var(--inp);border:1.5px solid var(--bd);border-radius:13px;padding:13px 14px;outline:0;
  transition:border-color .15s,box-shadow .15s,background .15s;color:var(--tx);
}
input::placeholder,textarea::placeholder{color:#9aacc4}
input:focus,select:focus,textarea:focus{
  border-color:#7fb0f0;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.10);
}
select option{color:#0f2442;background:#fff}
.err{color:var(--er);font-size:13px;min-height:18px;font-weight:500}

/* ---------- login ---------- */
#login{
  min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));
  max-width:470px;margin:auto;gap:16px;
}
.login-card{
  background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:26px 22px;
  box-shadow:var(--shadow2);
  display:grid;gap:14px;animation:pop .45s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
#login h1{font-size:27px;margin:6px 0 0;letter-spacing:-.03em;font-weight:800}
#login p{color:var(--mut);margin:0 0 2px;font-size:14.5px;line-height:1.5}
.login-badge{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
  background:var(--acsoft);color:#1d4ed8;font-size:12px;font-weight:700;
  padding:6px 12px;border-radius:99px;border:1px solid #cfe0fb;
}
.login-foot{text-align:center;font-size:12px;color:var(--mut);line-height:1.6}

/* ---------- app shell ---------- */
#app{
  min-height:100dvh;max-width:720px;margin:auto;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
}
header{
  position:sticky;top:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 18px;
  background:rgba(238,244,251,.78);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid rgba(201,217,236,.7);
}
header .logo{font-size:16.5px}
header .logo>span{width:34px;height:34px;border-radius:11px;font-size:14px}
header #ttl{font-weight:800;letter-spacing:-.02em}
main{padding:18px 16px;display:grid;gap:14px;align-content:start}

.card{
  background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;
  box-shadow:var(--shadow);
}
h2{font-size:18.5px;margin:0;letter-spacing:-.025em;font-weight:800}
h3{font-size:15px;margin:0 0 10px;letter-spacing:-.015em;font-weight:800}
.mut{color:var(--mut);font-size:13px;line-height:1.5}

.hero{
  background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 42%,#0891b2 100%);
  color:#fff;border:0;border-radius:22px;padding:20px;
  box-shadow:0 16px 36px -18px rgba(29,78,216,.75);
  position:relative;overflow:hidden;
}
.hero:after{
  content:"";position:absolute;right:-40px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.45),transparent 68%);
}
.hero:before{
  content:"";position:absolute;left:-30px;bottom:-90px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.20),transparent 70%);
}
.hero h2{font-size:21px;letter-spacing:-.03em}
.hero .mut{color:#cfe4ff}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{
  display:grid;gap:3px;padding:15px;border-radius:16px;
  background:linear-gradient(180deg,#ffffff,#f8fbff);
}
.stat .mut{font-size:12px;font-weight:600}
.stat b{display:block;font-size:23px;letter-spacing:-.03em;line-height:1.1}

.menu button{
  background:linear-gradient(180deg,#ffffff,#f7fbff);
  border:1px solid var(--bd);border-radius:18px;padding:16px 14px;text-align:left;cursor:pointer;
  min-height:112px;display:flex;flex-direction:column;gap:7px;
  box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  position:relative;overflow:hidden;
}
.menu button:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:#b9d3f2}
.menu button:active{transform:translateY(0) scale(.99)}
.menu .ic{
  font-size:17px;color:var(--ac);width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:var(--acsoft);margin-bottom:2px;
}
.menu b{font-size:14px;letter-spacing:-.015em;font-weight:800}
.menu .mut{font-size:11.5px;line-height:1.35}
.menu .wms{
  grid-column:1/-1;min-height:104px;
  background:linear-gradient(135deg,#1e40af,#2563eb 50%,#06b6d4);
  border:0;color:#fff;box-shadow:0 16px 32px -18px rgba(37,99,235,.85);
}
.menu .wms .ic{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(4px)}
.menu .wms .mut{color:#d7e8ff}
.menu .wms b{font-size:16px}

.seg{
  display:flex;background:#e8f0fa;border:1px solid var(--bd);border-radius:14px;padding:4px;gap:3px;
}
.seg button{
  flex:1;border:0;background:none;padding:11px 8px;border-radius:11px;font-weight:700;font-size:13px;
  color:var(--mut);cursor:pointer;transition:background .16s,color .16s,box-shadow .16s;
}
.seg button.on{background:#fff;color:#1d4ed8;box-shadow:0 2px 8px -2px rgba(15,36,66,.18)}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{
  font-size:11px;padding:4px 9px;border-radius:99px;background:#dcfce7;color:#15803d;
  font-weight:800;white-space:nowrap;letter-spacing:.01em;
}
.tag.w{background:#fef3c7;color:#a16207}
.tag.i{background:#dbeafe;color:#1d4ed8}

.empty{text-align:center;padding:32px 14px;color:var(--mut)}
.empty i{font-size:34px;opacity:.45;margin-bottom:12px;display:block}
.empty div{margin-bottom:14px;font-size:14px;font-weight:500}
.empty .btn{width:auto;margin:auto}

.tg{position:relative;width:48px;height:28px;flex:none}
.tg input{opacity:0;position:absolute;inset:0;z-index:2;margin:0;cursor:pointer;width:100%;height:100%}
.tg b{position:absolute;inset:0;background:#dbe6f3;border:1px solid var(--bd2);border-radius:99px;transition:.2s}
.tg b::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.tg input:checked+b{background:linear-gradient(135deg,#2563eb,#0891b2);border-color:#2563eb}
.tg input:checked+b::after{left:23px}

.fld{margin-bottom:11px}
.plan{position:relative;transition:border-color .16s,box-shadow .16s}
.plan.cur{border-color:#7fb0f0;box-shadow:0 0 0 4px rgba(37,99,235,.09),var(--shadow)}
.plan .price{font-size:26px;font-weight:800;letter-spacing:-.035em;margin:8px 0 2px}
.plan .price small{font-size:12px;font-weight:600}
.plan ul{list-style:none;padding:0;margin:12px 0;display:grid;gap:8px;font-size:13.5px;color:#27405f}
.plan li{display:flex;align-items:flex-start;gap:9px;line-height:1.4}
.plan li i{color:var(--ok);margin-top:3px;font-size:12px}
.pop{
  position:absolute;top:-11px;right:16px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;
  font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px;
  box-shadow:0 6px 14px -6px rgba(245,158,11,.9);letter-spacing:.02em;
}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-top:1px solid var(--bd);
  display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom,0px));
  max-width:720px;margin:auto;box-shadow:0 -6px 24px -18px rgba(15,36,66,.3);
}
nav button{
  flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;color:var(--mut);padding:7px 0 5px;cursor:pointer;border-radius:12px;
  transition:color .15s,background .15s;
}
nav button i{font-size:18px}
nav button.on{color:#1d4ed8;font-weight:800}
nav button.on i{transform:translateY(-1px)}
nav button.on::after{
  content:"";width:5px;height:5px;border-radius:50%;background:#1d4ed8;margin-top:1px;
}

#wms{position:fixed;inset:0;z-index:60;background:#000}
#wms iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#back{
  position:absolute;z-index:2;left:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:auto;padding:11px 16px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.35);
}

#sheet{
  position:fixed;inset:0;z-index:80;background:rgba(15,36,66,.42);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s ease both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet>div{
  background:var(--card);width:100%;max-width:720px;border-radius:26px 26px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:92dvh;overflow:auto;display:grid;gap:13px;
  box-shadow:0 -10px 40px rgba(15,36,66,.22);
  animation:up .28s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

.opt{
  display:flex;gap:11px;align-items:center;padding:14px 12px;border:1.5px solid var(--bd);
  border-radius:14px;cursor:pointer;font-weight:700;font-size:13.5px;background:var(--inp);
  transition:border-color .15s,background .15s;
}
.opt.on{border-color:#2563eb;background:#eaf2ff;color:#1d4ed8;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.opt i{font-size:16px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:104px;
  background:#0f2442;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:13.5px;
  z-index:90;white-space:nowrap;box-shadow:0 12px 28px -10px rgba(15,36,66,.55);
  animation:toastIn .25s cubic-bezier(.2,.8,.25,1) both;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--inp);padding:2px 6px;border-radius:6px;border:1px solid var(--bd)}

.card .row + .card{margin-top:10px}
#view .card{animation:rise .35s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:400px){
  .menu{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr 1fr}
  header .logo small{display:none}
}
</style>
</head>
<body>

<section id="login">
  <div class="logo"><span><i class="fa-solid fa-warehouse"></i></span><div>Bifetindo WMS<small>by Pivotal Indo</small></div></div>
  <div class="login-card">
    <span class="login-badge"><i class="fa-solid fa-bolt"></i> Platform B2B Industri</span>
    <h1>Masuk ke akun</h1>
    <p>Kelola gudang, pantau stok 3D, dan terhubung ke pasar B2B industri dalam satu platform.</p>
    <div><label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="nama@perusahaan.com"></div>
    <div><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="go"><i class="fa-solid fa-right-to-bracket"></i>Masuk</button>
    <button class="btn g" id="reg"><i class="fa-solid fa-user-plus"></i>Daftar akun baru</button>
  </div>
  <div class="login-foot">Dengan masuk, Anda menyetujui Ketentuan Layanan dan Kebijakan Privasi Bifetindo WMS.</div>
</section>

<div id="app" class="hide">
  <header>
    <div class="logo"><span><i class="fa-solid fa-warehouse"></i></span><div id="ttl">Beranda</div></div>
    <button class="btn g s" id="out"><i class="fa-solid fa-right-from-bracket"></i>Keluar</button>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<div id="wms" class="hide">
  <button class="btn" id="back"><i class="fa-solid fa-arrow-left"></i>Kembali ke Dashboard</button>
  <iframe id="fr" title="Sistem Gudang 3D"></iframe>
</div>
<div id="sheet" class="hide"><div id="sheetc"></div></div>

<script>
const G="<!DOCTYPE html><html lang=\"id\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Sistem Gudang 3D<\/title>\n<style>\n:root{--bg:rgba(13,27,51,.82);--in:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#eaf2ff;--mut:#9fb2d0;--ac:#20c3a0;--ok:#22c55e;--wr:#f5a524;--er:#ef4444;color-scheme:dark}\n@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:rgba(255,255,255,.88);--in:rgba(10,30,70,.06);--bd:rgba(10,30,70,.15);--tx:#0e2040;--mut:#51668a;color-scheme:light}}\n:root[data-theme=dark]{--bg:rgba(13,27,51,.82)}\n*{box-sizing:border-box}[hidden]{display:none!important}\nhtml,body{height:100%;margin:0;overflow:hidden;font:14px/1.4 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;color:var(--tx);background:#c9d1da}\ncanvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}\n.glass{position:fixed;background:var(--bg);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.25)}\n#side{left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(310px,calc(100vw - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}\n.brand{display:flex;gap:10px;align-items:center;padding:12px}.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em}\n.logo{width:38px;height:38px;border-radius:10px;background:var(--ac);display:grid;place-items:center;font-size:20px;color:#04261f}.brand div:nth-child(2){flex:1}\nbutton,input,select{font:inherit;color:inherit}\nbutton{cursor:pointer;border:0;background:var(--in);border-radius:10px;padding:8px 12px}\n#nav{display:flex;gap:4px;padding:0 12px 8px}#nav button{flex:1;padding:8px 4px;font-size:12px}#nav .on{background:var(--ac);color:#04261f;font-weight:600}\n.pn{overflow:auto;padding:4px 12px 12px}\nlabel{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}\ninput,select{width:100%;margin-top:3px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--in);outline:0}select option{color:#111}\ninput:focus,select:focus{border-color:var(--ac)}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}\n.pr{width:100%;background:var(--ac);color:#04261f;font-weight:700;padding:10px;margin-top:4px}\n.row{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;padding:8px;border-radius:10px;background:var(--in);margin-top:6px;cursor:pointer;align-items:center}\n.row:hover,.row.on{outline:1px solid var(--ac)}.row span{grid-column:1;color:var(--mut);font-size:12px}.row i{grid-row:1/3;grid-column:2;font-style:normal;font-size:11px;color:var(--ac)}.row button{grid-row:1/3;grid-column:3;padding:4px 8px;background:transparent}\n#stat{right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:230px;padding:14px}\n#stat .t{display:flex;gap:10px;align-items:center;margin-bottom:8px}#stat .t b{font-size:26px;display:block;line-height:1}#stat .t small{color:var(--mut)}\n#stat .ic{width:44px;height:44px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-size:22px}\n.st{display:flex;align-items:center;gap:8px;padding:3px 0}.st u{width:10px;height:10px;border-radius:50%}.st span{flex:1}.st small{color:var(--mut)}\n#mmw{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:10px}#mmw small{display:block;margin-bottom:4px}\n#bar{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px}\n#bar button{background:transparent}#bar .on{background:var(--in)}\n#dt{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:12px 14px;min-width:230px;display:flex;gap:14px;align-items:center}\n#dt b{font-size:15px}#dt small{display:block;color:var(--mut)}#dt button.x{background:var(--er);color:#fff}\n#tip{position:fixed;pointer-events:none;background:#000c;color:#fff;padding:4px 8px;border-radius:8px;font-size:12px;z-index:5}\n#ts{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--wr);color:#241600;padding:8px 14px;border-radius:10px;font-weight:600;z-index:9}\n.mut{color:var(--mut);font-size:12px}.ab{display:flex;gap:6px}.ab button{flex:1}\n#side.min #nav,#side.min .pn{display:none}\n@media(max-width:760px){#mmw{display:none}#stat{width:180px;padding:10px}#stat .ic{display:none}#dt{left:12px;right:12px;transform:none;bottom:calc(64px + env(safe-area-inset-bottom,0px))}#side{max-height:55%}}\ninput,select,textarea,button{font-size:16px}\n#side{left:0;right:0;top:auto;bottom:0;width:100%;max-width:520px;margin:0 auto;max-height:78%;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(110%);transition:transform .25s;z-index:10}\n#side.open{transform:none}\n.brand{padding:12px 16px 8px}#tg{width:40px;height:40px;border-radius:50%;padding:0}\n#nav{padding:0 16px 8px}#nav button,.pr,.ab button,#bar button{min-height:44px}.pn{padding:4px 16px 16px}\n#stat{left:12px;right:auto;top:calc(12px + env(safe-area-inset-top,0px));width:auto;padding:8px 14px;border-radius:999px;cursor:pointer}\n#stat .ic{display:none}#stat .t{margin:0}#stat .t div:last-child{display:flex;align-items:baseline;gap:6px}#stat .t b{font-size:18px}\n#stat .st{display:none}#stat.ex{border-radius:16px}#stat.ex .st{display:flex}\n#bar{left:auto;right:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;flex-direction:column;border-radius:14px}#bar button{width:44px;padding:0}\n#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#04261f;font-size:32px;line-height:1;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:5}\n#dt{left:12px;right:90px;transform:none;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-width:0}\n#mmw{bottom:calc(90px + env(safe-area-inset-bottom,0px))}\n.sp{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sp span{flex:1;font-size:12px;color:var(--mut)}.sp b{min-width:28px;text-align:center}.sp button{width:44px;min-height:44px;padding:0}\n#bar button{font-size:10px}#bar #v3,#bar #vt,#bar #vf{font-size:15px}\n#nv{left:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:5px}#nv button{width:42px;height:42px;padding:0;background:transparent;font-size:18px;touch-action:none;user-select:none}\n#dt{bottom:calc(84px + env(safe-area-inset-bottom,0px))}\n#bar #vm{font-size:18px}#bar #vm.on{background:var(--ac);color:#04261f}\n#stat{z-index:6}#wh{position:fixed;left:12px;top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 80px);z-index:4}\n#wh button{background:var(--bg);border:1px solid var(--bd);min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}#wh .on{background:var(--ac);color:#04261f;font-weight:700;border-color:var(--ac)}\n#hd{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:7;width:36px;height:36px;border-radius:50%;padding:0;background:var(--bg);border:1px solid var(--bd);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:16px;opacity:.85}\n#bar{top:calc(56px + env(safe-area-inset-top,0px));padding:3px;gap:2px;border-radius:12px;opacity:.88}#bar button{min-height:34px;width:36px;font-size:9px;border-radius:8px}#bar #v3,#bar #vt,#bar #vf,#bar #vm{font-size:14px}\n#nv{padding:3px;gap:0;border-radius:12px;opacity:.88}#nv button{width:34px;height:34px;font-size:15px}\n#fab{width:46px;height:46px;font-size:26px}\n#stat{padding:6px 12px;opacity:.9}#mmw{padding:6px;opacity:.9}#mmw small{display:none}\n#wh button{min-height:30px;padding:0 10px;font-size:12px}\n#bar #vt{display:none}#bar #v3{font-size:10px;font-weight:600}#nv .on{background:var(--ac);color:#04261f}\n#mvp{left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));bottom:calc(150px + env(safe-area-inset-bottom,0px));padding:12px;z-index:8}#mvp label{margin-bottom:6px}\ntextarea{font:inherit;color:inherit;width:100%;margin-top:3px;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:var(--in);outline:0;resize:vertical;min-height:58px}textarea:focus{border-color:var(--ac)}\n#sk{text-transform:uppercase}\n.row span.ds{font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:1}\n#d2{white-space:normal;max-width:46vw}\n#rp{left:12px;right:90px;bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:6}\n#rp div{flex:1;min-width:0}#rp b{font-size:15px}#rp small{display:block;color:var(--mut)}#rp button.x{background:var(--er);color:#fff}\nbody.ui-off #bar,body.ui-off #nv,body.ui-off #stat,body.ui-off #mmw,body.ui-off #wh,body.ui-off #fab{display:none!important}\n\n/* mode FPS */\n#fpc,#fph,#fpx,#fpj{display:none;position:fixed;z-index:12}\nbody.fps #fpc{display:block;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}\n#fpc:before,#fpc:after{content:\"\";position:absolute;background:#fff;mix-blend-mode:difference}\n#fpc:before{left:10px;top:0;width:2px;height:22px}#fpc:after{top:10px;left:0;height:2px;width:22px}\nbody.fps #fpx{display:block;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));padding:8px 14px;border-radius:999px;font-weight:600;z-index:13;min-height:0}\nbody.fps #fph{display:block;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top,0px));padding:8px 14px;border-radius:12px;font-size:12px;text-align:center;max-width:calc(100vw - 24px);pointer-events:none;transition:opacity .4s}\nbody.fps #fph.fade{opacity:0}\nbody.fps #fpj.show{display:block;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);pointer-events:none}\n#fpj i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none}\nbody.fps #nv,body.fps #stat,body.fps #bar button:not(#fp){display:none!important}body.fps #wh{top:calc(104px + env(safe-area-inset-top,0px))}\n#bar #fp{font-size:10px;font-weight:700}#bar #fp.on{background:var(--ac);color:#04261f}\n#auth{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:var(--bg);padding:16px}#auth.show{display:grid}#auth .bx{width:min(380px,100%);padding:20px}#auth h2{margin:0 0 12px}#auth label{display:block;margin-bottom:8px}#auth .lk{background:none;color:var(--ac);text-decoration:underline;min-height:0;padding:6px 0;margin-top:6px}#auth .er{color:var(--er);min-height:18px;font-size:13px;margin:8px 0 0}\n<\/style><\/head><body>\n<canvas id=\"c\"><\/canvas>\n<aside id=\"side\" class=\"glass\">\n <div class=\"brand\"><div class=\"logo\">\u25a4<\/div><div><b>Sistem Gudang<\/b><small>TETA SAINS<\/small><\/div><button id=\"tg\" title=\"Tutup\">\u2715<\/button><\/div>\n <nav id=\"nav\"><button data-p=\"in\" class=\"on\">Penerimaan<\/button><button data-p=\"st\">Stok Barang<\/button><button data-p=\"pg\">Pengaturan<\/button><\/nav>\n <section class=\"pn\" id=\"p-in\"><form id=\"f\">\n  <label>Nama barang<input id=\"nm\" required maxlength=\"24\" placeholder=\"mis. Laptop Asus\"><\/label>\n  <label>Jenis<input id=\"jn\" required maxlength=\"16\" list=\"jl\" placeholder=\"mis. Elektronik\"><\/label>\n  <datalist id=\"jl\"><option>Elektronik<option>Pakaian<option>Makanan<option>Furnitur<option>Peralatan<option>Lainnya<\/datalist>\n  <label>SKU / Kode<input id=\"sk\" maxlength=\"24\" autocomplete=\"off\" placeholder=\"mis. ELK-001\"><\/label>\n  <label>Deskripsi<textarea id=\"ds\" maxlength=\"140\" rows=\"2\" placeholder=\"Catatan barang, mis. warna, ukuran, supplier (opsional)\"><\/textarea><\/label>\n  <div class=\"g2\"><label>Berat (kg)<input id=\"bt\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"1\" required><\/label><label>Jumlah kotak<input id=\"qt\" type=\"number\" min=\"1\" max=\"50\" value=\"1\"><\/label><\/div>\n  <label>Lokasi<select id=\"md\"><option value=\"a\">Otomatis (slot kosong berikutnya)<option value=\"m\">Pilih manual<\/select><\/label>\n  <div id=\"man\" class=\"g3\" hidden><label>Rak<select id=\"rk\"><\/select><\/label><label>Tingkat<select id=\"lv\"><\/select><\/label><label>Sekat<select id=\"by\"><\/select><\/label><\/div>\n  <button class=\"pr\">Tambah ke rak<\/button><\/form><\/section>\n <section class=\"pn\" id=\"p-st\" hidden><input id=\"q\" placeholder=\"Cari nama, SKU, deskripsi, atau jenis...\"><div id=\"ls\"><\/div><\/section>\n <section class=\"pn\" id=\"p-pg\" hidden>\n  <div id=\"tm\" style=\"margin-bottom:12px\"><\/div>\n  <p class=\"mut\">Gudang baru otomatis berjejer di sebelah kanan gudang sebelumnya. Pengaturan di bawah berlaku untuk gudang yang aktif.<\/p>\n  <label>Jumlah rak (maks. 30)<\/label><div class=\"ab\" style=\"margin-bottom:10px\"><button type=\"button\" id=\"rm\">\u2212<\/button><input id=\"nr\" type=\"number\" min=\"0\" max=\"30\" style=\"flex:2;margin:0;text-align:center\"><button type=\"button\" id=\"ad\">+<\/button><\/div>\n<div class=\"sp\"><span>Sekat ke kanan (maks. 12)<\/span><button type=\"button\" data-k=\"bays\" data-d=\"-1\">\u2212<\/button><b id=\"vb2\"><\/b><button type=\"button\" data-k=\"bays\" data-d=\"1\">+<\/button><\/div>\n<div class=\"sp\"><span>Tingkat tiap rak (maks. 8)<\/span><button type=\"button\" data-k=\"lv\" data-d=\"-1\">\u2212<\/button><b id=\"vl2\"><\/b><button type=\"button\" data-k=\"lv\" data-d=\"1\">+<\/button><\/div>\n<div class=\"sp\"><span>Lantai gudang ke atas (maks. 4)<\/span><button type=\"button\" data-k=\"fl\" data-d=\"-1\">\u2212<\/button><b id=\"vg2\"><\/b><button type=\"button\" data-k=\"fl\" data-d=\"1\">+<\/button><\/div>\n<div class=\"sp\"><select id=\"dr\" style=\"margin:0\"><\/select><button type=\"button\" id=\"drb\" style=\"width:auto;padding:0 14px;background:var(--er);color:#fff\">Hapus rak<\/button><\/div>\n<div class=\"sp\"><select id=\"df\" style=\"margin:0\"><\/select><button type=\"button\" id=\"dfb\" style=\"width:auto;padding:0 14px;background:var(--er);color:#fff\">Hapus lantai<\/button><\/div>\n  <div class=\"g2\"><label>Lebar gudang (m)<input id=\"aw\" type=\"number\" step=\"any\" inputmode=\"decimal\"><\/label><label>Kedalaman gudang (m)<input id=\"ah\" type=\"number\" step=\"any\" inputmode=\"decimal\"><\/label><\/div>\n  <p class=\"mut\" id=\"amin\" style=\"margin-top:0\"><\/p>\n  <div class=\"ab\" style=\"margin-bottom:10px\"><button type=\"button\" id=\"ar\">Ukuran otomatis<\/button><button type=\"button\" id=\"dcb\"><\/button><\/div>\n  <label>Kapasitas tiap kolom: <b id=\"cv\"><\/b> kotak<input id=\"cp\" type=\"range\" min=\"1\" max=\"12\"><\/label>\n  <p class=\"mut\">Tiap kolom (satu sekat di satu tingkat) memuat kotak 3 lebar \u00d7 2 dalam \u00d7 maks. 2 susun.<\/p>\n  <div class=\"ab\"><button id=\"demo\">Isi contoh<\/button><button id=\"clr\">Kosongkan<\/button><\/div>\n  <div class=\"ab\" style=\"margin-top:8px\"><button id=\"dw\" style=\"background:var(--er);color:#fff\">Hapus gudang ini<\/button><\/div><\/section>\n<\/aside>\n<div id=\"stat\" class=\"glass\"><div class=\"t\"><div class=\"ic\">\ud83d\udce6<\/div><div><small id=\"sn\">Total Barang<\/small><b id=\"s0\">0<\/b><\/div><\/div>\n <div class=\"st\"><u style=\"background:var(--ok)\"><\/u><span>Slot tersedia<\/span><b id=\"s1\"><\/b><\/div>\n <div class=\"st\"><u style=\"background:var(--wr)\"><\/u><span>Kolom hampir penuh<\/span><b id=\"s2\"><\/b><\/div>\n <div class=\"st\"><u style=\"background:var(--er)\"><\/u><span>Kolom penuh<\/span><b id=\"s3\"><\/b><\/div>\n <div class=\"st\"><small>Total berat <b id=\"s4\"><\/b> kg<\/small><\/div><\/div>\n<div id=\"mmw\"
